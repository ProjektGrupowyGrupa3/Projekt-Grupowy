<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/stylesheets/style.css">
    <link rel="stylesheet" href="/static/stylesheets/rank.css">
</head>
<body>
   <div class="container mt-5">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🏆 <span data-translate="rank_title">Ranking</span></h3>
        
        <div class="d-flex align-items-center">
            <label for="periodSelect" class="me-2 fw-bold" data-translate="rank_period_label">Okres:</label>
            
            <select id="periodSelect" class="form-select w-auto" onchange="loadRanking()">
                <option value="all" data-translate="rank_period_all">Od początku</option>
                <option value="current_week" selected data-translate="rank_period_curr_week">Bieżący tydzień</option>
                <option value="last_week" data-translate="rank_period_last_week">Poprzedni tydzień</option>
            </select>
        </div>
    </div>

    <div class="table-responsive shadow-sm rounded" style="display:none;" id="rankingContainer">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th scope="col" style="width: 100px;">#</th> 
                    <th scope="col" data-translate="rank_col_user">Użytkownik</th>
                    <th scope="col" data-translate="rank_col_points">Punkty</th>
                </tr>
            </thead>
            <tbody id="rankingTableBody">
                </tbody>
        </table>
    </div>

    <div id="loadingBox" class="text-center my-4" style="display:none;">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div id="errorBox" class="alert alert-danger mt-4" style="display:none;" data-translate="rank_error_fetch">
        Nie udało się pobrać rankingu.
    </div>
</div>
<script src="/static/javascripts/script.js"></script>
<script>
    async function loadRanking() {
        const period = document.getElementById('periodSelect').value;
        const tbody = document.getElementById("rankingTableBody");
        const container = document.getElementById("rankingContainer");
        const loading = document.getElementById("loadingBox");
        const errorBox = document.getElementById("errorBox");
        const loggedInUserStr = localStorage.getItem('user');
        const loggedInUser = loggedInUserStr ? JSON.parse(loggedInUserStr) : null;

        // Reset widoku
        container.style.display = "none";
        errorBox.style.display = "none";
        loading.style.display = "block";
        tbody.innerHTML = "";

        try {
            const res = await fetch(`/rank/api?period=${period}`);
            if (!res.ok) throw new Error("Błąd serwera");
            const data = await res.json();
            
            let htmlContent = "";

            data.ranking.forEach((user, index) => {
            let rowClass = "";
            let rankDisplay = index + 1;
            
            // 1. Logika Podium (Medale)
            if (index === 0) { 
                rowClass = "rank-gold"; 
                rankDisplay = "🥇"; 
            } else if (index === 1) { 
                rowClass = "rank-silver"; 
                rankDisplay = "🥈"; 
            } else if (index === 2) { 
                rowClass = "rank-bronze"; 
                rankDisplay = "🥉"; 
            }

            // 2. Sprawdzenie zalogowanego użytkownika (POPRAWKA: Bezpieczne ID i zmienna)
            // Używamy String(), aby uniknąć problemów typu "123" !== 123
            const isCurrentUser = loggedInUser && (
                String(user._id) === String(loggedInUser._id) || 
                user.name === loggedInUser.name
            );

            if (isCurrentUser) {
                // Dodajemy klasę (spacja na początku jest ważna)
                rowClass += " current-user-row"; 
            }

            // 3. Logika Trendów
            let changeVal = user.change || 0; 
            let trendHtml = '';

            if (changeVal > 0) {
                trendHtml = `<small class="trend-up ms-2">▲${changeVal}</small>`;
            } else if (changeVal < 0) {
                trendHtml = `<small class="trend-down ms-2">▼${Math.abs(changeVal)}</small>`;
            } 

            // 4. Generowanie wiersza
            htmlContent += `
                <tr class="${rowClass}">
                    <th scope="row" class="align-middle">
                        <div class="d-flex align-items-center">
                            <span style="width: 25px; text-align: center;">${rankDisplay}</span>
                            ${trendHtml}
                        </div>
                    </th>
                    <td class="align-middle fw-semibold">
                        ${user.name}
                        ${isCurrentUser ? '<span class="badge bg-primary ms-2" style="font-size: 0.7em;">Ty</span>' : ''}
                    </td>
                    <td class="align-middle">${user.points} pkt</td>
                </tr>
            `;
        });

            tbody.innerHTML = htmlContent;
            loading.style.display = "none";
            
            if (data.ranking.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4">Brak danych dla wybranego okresu</td></tr>';
            }
            
            container.style.display = "block";

        } catch (err) {
            console.error(err);
            loading.style.display = "none";
            errorBox.style.display = "block";
        }
    }
    window.onload = loadRanking;
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/javascripts/translations.js"></script>
</body>
</html>
