<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/stylesheets/style.css">
</head>
<body>
    <div class="container py-5">
    <h2 class="mb-4 text-center">Najlepsi użytkownicy</h2>

    <!-- Tabela rankingu -->
    <div class="table-responsive" style="display:none;" id="rankingContainer">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Użytkownik</th>
                    <th scope="col">Punkty</th>
                </tr>
            </thead>
            <tbody id="rankingTableBody">
            </tbody>
        </table>
    </div>

    <!-- Komunikat błędu -->
    <div id="errorBox" class="alert alert-danger mt-4" style="display:none;">
        Nie udało się pobrać rankingu. Spróbuj ponownie później.
    </div>
</div>
<script src="/static/javascripts/script.js"></script>
<script>
    async function loadRanking() {
        try {
            const res = await fetch("rank/api");

            if (!res.ok) {
                throw new Error("Błąd po stronie serwera");
            }

            const data = await res.json();
            const tbody = document.getElementById("rankingTableBody");

            tbody.innerHTML = "";

            data.ranking.forEach((user, index) => {
                tbody.innerHTML += `
                    <tr>
                        <th scope="row">${index + 1}</th>
                        <td>${user.name}</td>
                        <td>${user.points}</td>
                    </tr>
                `;
            });

            document.getElementById("rankingContainer").style.display = "block";

        } catch (err) {
            console.error(err);
            document.getElementById("errorBox").style.display = "block";
        }
    }

    window.onload = loadRanking;
</script>
