<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnIt — Create Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/stylesheets/style.css">
    <link rel="stylesheet" href="static/stylesheets/createTest.css">
</head>
<body>
    
<main class="container-fluid py-5 px-4">
    <section id="creator-section">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-6" data-t="headerTitle">Stwórz własny test</h1>
            </div>
        </div>

        <div class="row mb-4 justify-content-center">
            <div class="col-md-11">
                <div class="card p-3">
                    <div class="d-md-flex align-items-center justify-content-between gap-3">
                        <div class="card p-3 flex-grow-1 bg-dark bg-opacity-10">
                            <div class="flex-grow-1">
                                <label class="form-label fw-bold" data-t="testNameLabel">Nazwa testu</label>
                                <input type="text" id="test-title" class="form-control form-control-lg" data-placeholder="testNamePlaceholder" placeholder="Nazwij swój test...">
                            </div>
                            <div class="mt-4">
                                <label class="form-label fw-bold" data-t="tagsLabel">Tagi testu</label>
                                <input type="text" id="tagsInput" class="form-control"
                                    data-placeholder="tagsPlaceholder" placeholder='przykład "Matematyka..."'>
                                <small data-t="tagsHint">Oddziel tagi przecinkami</small>
                            </div>

                            <div class="mt-3 form-check form-switch d-flex align-items-center">
                                <input class="form-check-input" type="checkbox" role="switch" id="publicSwitch" 
                                    style="width: 3em; height: 1.5em; cursor: pointer;" disabled>
                                
                                <label class="form-check-label ms-3 label" for="publicSwitch">
                                    <div class="d-flex align-items-center">
                                        <span id="publicLabel" class="fw-bold" data-t="testStatusName">Prywatny</span>
                                        <i id="publicIcon" class="bi bi-lock-fill ms-2 text-secondary"></i>
                                    </div>
                                    <small id="publicDesc" data-t="testStatusDesc">Wpisz tytuł, aby odblokować</small>
                                </label>
                            </div>

                        </div>
                        <div class="d-flex flex-column gap-2 mt-3 mt-md-0">
                            <button class="btn btn-outline-warning" onclick="resetCreator()" data-t="btnNew">Nowy</button>
                            <button class="btn btn-success" onclick="saveTest()" data-t="btnSave">💾 Zapisz Test</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-xl-4 col-lg-5">
                <div class="card p-4 h-100">
                    <h4 class="mb-3"><span data-t="newQuestionHeader">Nowe pytanie</span> <span id="q-counter" class="badge bg-secondary float-end">0/60</span></h4>
                    <form id="add-question-form">
                        <div class="mb-3">
                            <label class="form-label" data-t="qContentLabel">Treść pytania</label>
                            <textarea class="form-control" id="inputQuestion" rows="2" data-placeholder="qPlaceholder" placeholder="Wpisz treść pytania..." required></textarea>
                        </div>
                        
                        <div id="answers-container" class="row g-2 mb-3">
                            </div>

                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <button type="button" class="btn btn-outline-danger btn-sm" data-t="delOpt" onclick="removeAnswerOption()">- Usuń opcję</button>
                            <button type="button" class="btn btn-outline-success btn-sm" data-t="addOpt" onclick="addAnswerOption()">+ Dodaj opcję</button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" data-t="correctAnswerLabel">Poprawne odpowiedzi:</label>
                            <div id="correct-answers-container" class="d-flex flex-wrap gap-3">
                                </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" data-t="explanationLabel">Wyjaśnienie (opcjonalne)</label>
                            <textarea class="form-control" id="inputExplanation" rows="2" data-placeholder="explanation"
                                placeholder="Explain why each answer is correct..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="add-q-btn" data-t="btnAddQuestion">Dodaj pytanie</button>
                        <div id="limit-warning" class="text-danger mt-2 text-center d-none" data-t="limitWarning">Osiągnięto limit 60 pytań!</div>
                    </form>
                </div>
            </div>

            <div class="col-xl-4 col-lg-7">
                <div class="card p-4 h-100">
                    <h4 class="mb-3" data-t="previewHeader">Podgląd pytań</h4>
                    <div id="questions-list" style="max-height: 500px; overflow-y: auto;">
                        <p class="text-center mt-5" id="empty-msg" data-t="emptyMsg">Brak dodanych pytań. Dodaj pierwsze pytanie po lewej stronie.</p>
                    </div>
                    <hr>
                    <button id="start-test-btn" class="btn btn-success w-100 btn-lg mt-3" disabled data-t="btnStart">Rozpocznij Test</button>
                </div>
            </div>

            <div class="col-xl-4 col-lg-12">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0" data-t="libraryHeader">Twoja Biblioteka</h4>
                        <button class="btn btn-sm btn-outline-info" onclick="renderSavedTestsList()" data-t="btnRefresh">Odśwież 🔄</button>
                    </div>
                    <div id="saved-tests-list" class="list-group list-group-flush" style="max-height: 600px; overflow-y: auto;"></div>
                    <p id="no-saved-tests-msg" class="text-center mt-5" data-t="noSavedTests">Brak zapisanych testów.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="quiz-section" class="d-none">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 id="quiz-title" data-t="userTestTitle">Test Użytkownika</h3>
                        <span id="quiz-progress" class="badge bg-primary fs-6">1 / 5</span>
                    </div>
                    <div id="quiz-container"></div>
                    <div class="d-flex justify-content-between mt-4">
                        <button class="btn btn-outline-light" id="prev-q-btn" style="visibility: hidden;" data-t="btnPrev">Poprzednie</button>
                        <button class="btn btn-primary" id="next-q-btn" data-t="btnNext">Następne</button>
                        <button class="btn btn-success d-none" id="finish-quiz-btn" data-t="btnFinish">Zakończ i Sprawdź</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="results-section" class="d-none">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-4">
                <h2 class="display-5" data-t="resultTitle">Wynik Testu</h2>
                <div class="card p-3 d-inline-block mt-3 bg-opacity-25 bg-success">
                    <h1 class="display-3 fw-bold" id="score-display">0%</h1>
                    <p class="mb-0" id="score-details">0 / 0 poprawnych</p>
                </div>
                <div class="mt-4">
                    <button class="btn btn-warning" onclick="backToCreator()" data-t="btnBackToEdit">Wróć do edycji</button>
                    <button class="btn btn-secondary" onclick="restartQuiz()" data-t="btnRestart">Rozwiąż ponownie</button>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h4 class="mb-3" data-t="detailsHeader">Szczegółowe odpowiedzi:</h4>
                <div id="results-list"></div>
            </div>
        </div>
    </section>
</main>

<script src="static/javascripts/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="static/javascripts/translations.js"></script>

    // --- 2. SYSTEM TŁUMACZEŃ ---
    
    function getLang() {
        return (localStorage.getItem('language') || document.documentElement.lang || 'pl').toLowerCase();
    }

    function t(key) {
        const lang = getLang();
        if (dictionary[lang] && dictionary[lang][key]) {
            return dictionary[lang][key];
        }
        return dictionary['pl'][key] || key;
    }

    function applyTranslations() {
        document.querySelectorAll('[data-t]').forEach(el => {
            el.innerText = t(el.getAttribute('data-t'));
        });
        
        document.querySelectorAll('[data-placeholder]').forEach(el => {
            const key = el.getAttribute('data-placeholder');
            const suffix = el.id.includes('input') && ['A','B','C','D'].includes(el.id.slice(-1)) 
                           ? ' ' + el.id.slice(-1) : '';
            el.placeholder = t(key) + suffix;
        });

        const btn = document.getElementById('add-q-btn');
        if (btn) {
            btn.innerText = (editingIndex !== null) ? t('btnSaveChanges') : t('btnAddQuestion');
        }

        renderQuestionsList();
        
        const noTestsMsg = document.getElementById('no-saved-tests-msg');
        if (noTestsMsg && noTestsMsg.style.display !== 'none') {
             noTestsMsg.innerText = t('noSavedTests');
        }
        
        checkLimits();
    }

    // --- 3. AUTODETEKCJA ZMIANY JĘZYKA ---
    let lastKnownLang = getLang();

    document.addEventListener('click', () => {
        setTimeout(() => {
            const currentLang = getLang();
            if (currentLang !== lastKnownLang) {
                lastKnownLang = currentLang;
                applyTranslations();
                renderSavedTestsList(); 
                console.log("Język zmieniony na:", currentLang);
            }
        }, 50);
    });

    // --- 4. ZMIENNE STANU ---
    let questions = [];
    let currentQuestionIndex = 0;
    let userAnswers = {}; 
    const MAX_QUESTIONS = 60;
    let testID = "";
    let editingIndex = null;
    
    const creatorSection = document.getElementById('creator-section');
    const quizSection = document.getElementById('quiz-section');
    const resultsSection = document.getElementById('results-section');
    const form = document.getElementById('add-question-form');
    const questionsListEl = document.getElementById('questions-list');
    const emptyMsg = document.getElementById('empty-msg');
    const qCounter = document.getElementById('q-counter');
    const limitWarning = document.getElementById('limit-warning');
    const testTitleInput = document.getElementById('test-title');
    const tagsInput = document.getElementById('tagsInput');
    const publicSwitch = document.getElementById('publicSwitch');
    const startTestBtn = document.getElementById('start-test-btn');
    const quizTitleEl = document.getElementById('quiz-title');
    const quizContainer = document.getElementById('quiz-container');
    const nextBtn = document.getElementById('next-q-btn');
    const prevBtn = document.getElementById('prev-q-btn');
    const finishBtn = document.getElementById('finish-quiz-btn');
    const progressBadge = document.getElementById('quiz-progress');
    const scoreDisplay = document.getElementById('score-display');
    const scoreDetails = document.getElementById('score-details');
    const resultsList = document.getElementById('results-list');
    const addQBtn = document.getElementById('add-q-btn');

    // --- INICJALIZACJA ---
    document.addEventListener('DOMContentLoaded', () => {
        applyTranslations();
        renderSavedTestsList();
        updatePrivacyUI();
        renderAnswerInputs();
    });

    document.getElementById('publicSwitch').addEventListener('change', updatePrivacyUI);

    // --- LOGIKA KREATORA ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Blokada dodawania nowych jeśli limit osiągnięty (chyba że edytujemy)
        if (questions.length >= MAX_QUESTIONS && editingIndex === null) return;

        // 1. Pobieramy wartości tekstowe
        const answerInputs = document.querySelectorAll('.answer-input');
        const answersArray = Array.from(answerInputs).map(input => input.value);

        // 2. Pobieramy zaznaczone poprawne odpowiedzi
        const checkboxes = document.querySelectorAll('.correct-checkbox:checked');
        const selectedCorrect = Array.from(checkboxes).map(cb => cb.value);

        // Walidacja
        if (selectedCorrect.length === 0) {
            if(typeof showToast === 'function') showToast("Zaznacz przynajmniej jedną poprawną odpowiedź", "warning");
            else alert("Zaznacz poprawną odpowiedź");
            return;
        }

        const newQ = {
            question: document.getElementById('inputQuestion').value,
            answers: answersArray, 
            correct: selectedCorrect,
            // 👇 NOWE: Pobieramy wyjaśnienie i usuwamy białe znaki z początku/końca
            explanation: document.getElementById('inputExplanation').value.trim() 
        };

        // 3. Logika Zapisywania
        if (editingIndex !== null) {
            // EDYCJA: Nadpisujemy istniejące
            questions[editingIndex] = newQ;
            
            // Czyścimy flagę edycji
            editingIndex = null;
            addQBtn.innerText = t('btnAddQuestion'); 
        } else {
            // NOWE: Dodajemy na koniec
            questions.push(newQ);
        }

        // 4. Odświeżenie widoku
        renderQuestionsList();
        
        // 5. Reset formularza
        form.reset();
        
        // WAŻNE: Przywracamy domyślny stan formularza (4 odpowiedzi)
        currentAnswerCount = 4;
        renderAnswerInputs(); 
        
        checkLimits();
    });

    function checkLimits() {
        qCounter.innerText = `${questions.length}/${MAX_QUESTIONS}`;
        startTestBtn.disabled = questions.length === 0;
        
        if (questions.length > 0) {
            emptyMsg.style.display = 'none';
        } else {
            emptyMsg.style.display = 'block';
            emptyMsg.innerText = t('emptyMsg'); 
        }
        
        if (questions.length >= MAX_QUESTIONS) {
            limitWarning.classList.remove('d-none');
            addQBtn.disabled = true;
        } else {
            limitWarning.classList.add('d-none');
            addQBtn.disabled = false;
        }
    }

    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    let currentAnswerCount = 4; // Domyślnie startujemy z 4
    const MIN_ANSWERS = 2;
    const MAX_ANSWERS = 8;

    // --- 1. FUNKCJA RENDERUJĄCA ODPOWIEDZI ---
    function renderAnswerInputs() {
        const container = document.getElementById('answers-container');
        const existingValues = [];
        document.querySelectorAll('.answer-input').forEach(input => existingValues.push(input.value));

        container.innerHTML = ''; 

        for (let i = 0; i < currentAnswerCount; i++) {
            const letter = LETTERS[i];
            const val = existingValues[i] || '';

            const colDiv = document.createElement('div');
            colDiv.className = 'col-12 col-md-6'; 
            
            colDiv.innerHTML = `
                <div class="input-group">
                    <span class="input-group-text bg-transparent text-light border-secondary fw-bold" style="width: 40px; justify-content: center;">${letter}</span>
                    <input type="text" class="form-control answer-input" 
                        id="input${letter}" 
                        data-letter="${letter}" 
                        value="${val}"
                        data-placeholder="answerPlaceholder" 
                        placeholder="Answer ${letter}" required>
                </div>
            `;
            container.appendChild(colDiv);
        }

        renderCorrectCheckboxes(); 
    }

    // --- 2. FUNKCJA RENDERUJĄCA CHECKBOXY ---
    function renderCorrectCheckboxes() {
        const container = document.getElementById('correct-answers-container');
        
        // Zapamiętujemy, co jest zaznaczone
        const checkedValues = [];
        document.querySelectorAll('.correct-checkbox:checked').forEach(cb => checkedValues.push(cb.value));

        container.innerHTML = '';

        for (let i = 0; i < currentAnswerCount; i++) {
            const letter = LETTERS[i];
            const isChecked = checkedValues.includes(letter) ? 'checked' : '';

            const uniqueId = `correct-check-${letter}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'form-check';
            wrapper.innerHTML = `
                <input class="form-check-input correct-checkbox" type="checkbox" value="${letter}" id="${uniqueId}" ${isChecked}>
                <label class="form-check-label" style="cursor: pointer" for="${uniqueId}">${letter}</label>
            `;
            container.appendChild(wrapper);
        }
    }

    // --- 3. OBSŁUGA PRZYCISKÓW +/- ---
    window.addAnswerOption = function() {
        if (currentAnswerCount < MAX_ANSWERS) {
            currentAnswerCount++;
            renderAnswerInputs();
        } else {
            showToast("Maksymalnie 8 odpowiedzi", "warning");
        }
    };

    window.removeAnswerOption = function() {
        if (currentAnswerCount > MIN_ANSWERS) {
            currentAnswerCount--;
            renderAnswerInputs();
        } else {
            showToast("Minimum 2 odpowiedzi", "warning");
        }
    };

    function renderQuestionsList() {
        questionsListEl.innerHTML = '';
        if (questions.length === 0) {
            questionsListEl.appendChild(emptyMsg);
            emptyMsg.innerText = t('emptyMsg');
            return;
        }
        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'card mb-2 p-3 question-preview bg-dark bg-opacity-10';
            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <strong>${index + 1}. ${q.question}</strong>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-primary" onclick="editQuestion(${index})">${t('btnEdit')}</button>
                        <button class="btn btn-outline-danger" onclick="removeQuestion(${index})">${t('btnDelete')}</button>
                    </div>
                </div>
                <div class="small mt-2 text-muted">${t('correctAnswer')}: <span class="fw-bold text-success">${q.correct}</span></div>
            `;
            questionsListEl.appendChild(div);
        });
    }

    window.editQuestion = function (index) {
        const q = questions[index];

        // --- 1. ADAPTER (Naprawa starych danych) ---
        if (!q.answers) {
            q.answers = [];
            if (q.answerA) q.answers.push(q.answerA);
            if (q.answerB) q.answers.push(q.answerB);
            if (q.answerC) q.answers.push(q.answerC);
            if (q.answerD) q.answers.push(q.answerD);
            
            if (q.answers.length < 2) {
                q.answers = ["", "", "", ""]; 
            }
        }
        
        if (!Array.isArray(q.correct)) {
            q.correct = [q.correct];
        }

        document.getElementById('inputQuestion').value = q.question;
        
        document.getElementById('inputExplanation').value = q.explanation || "";

        currentAnswerCount = q.answers.length;
        
        renderAnswerInputs();

        const inputs = document.querySelectorAll('.answer-input');
        q.answers.forEach((ans, i) => {
            if(inputs[i]) inputs[i].value = ans;
        });

        document.querySelectorAll('.correct-checkbox').forEach(cb => cb.checked = false);

        q.correct.forEach(val => {
            const cb = document.querySelector(`.correct-checkbox[value="${val}"]`);
            if(cb) cb.checked = true;
        });

        editingIndex = index;
        addQBtn.innerText = t('btnSaveChanges'); 
        
        document.getElementById('creator-section').scrollIntoView({ behavior: 'smooth' });
    };

    window.selectAnswer = function(letter, inputElement) {
        const label = inputElement.closest('label');

        if (inputElement.checked) {
            label.classList.add('active');
        } else {
            label.classList.remove('active');
        }
    };

    window.removeQuestion = function(index) {
        questions.splice(index, 1);
        renderQuestionsList();
        checkLimits();
    };

    window.resetCreator = function() {
        if(confirm(t('alertClearConfirm'))) {
            questions = [];
            testTitleInput.value = "";
            tagsInput.value = "";
            publicSwitch.checked = false;
            testID = "";
            renderQuestionsList();
            checkLimits();
        }
    };

    // --- LOGIKA ZAPISYWANIA I WCZYTYWANIA ---
    window.saveTest = async function() {
        const token = localStorage.token;
        
        if (questions.length === 0) {
            alert(t('alertAddOne'));
            return;
        }

        const tags = tagsInput.value.split(",").map(t => t.trim());
        const title = testTitleInput.value.trim() || t('userTestTitle') + " (" + new Date().toLocaleDateString() + ")";
        
        const isPublic = document.getElementById('publicSwitch').checked;
        
        const lang = getLang();

        const isNewTest = !testID;
        
        // Sprawdzenie czy jest to nowy test, czy już istniejący w bazie którego chcemy zmodyfikować
        let url = "/api/tests/create";
        let method = "POST";


        try {
            const res = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`,
                    "X-Language": lang 
                },
                
                body: JSON.stringify({ 
                    title, 
                    tags, 
                    questions, 
                    isPublic, 
                    testID    
                })
            });
            
            
            if (!res.ok) {
                const error = await res.json();
                throw new Error(error.message || `Błąd: ${res.status}`);
            }

            if (typeof showToast === 'function') {
                if (isNewTest && isPublic) {
                    showToast(t('alertSavedPublic'), 'success');
                }
                if (!isPublic) {
                    showToast(t('alertSavedPrivate'), 'success');
                } 
                if (isPublic) {
                    showToast(t('alertSavedPublic'), 'success');
                }
            } else {
                showToast(t('errorSave'), 'danger');
            }
            

            const responseData = await res.json();
            if (!testID && responseData._id) {
                testID = responseData._id;
            } else if (!testID && responseData.testId) {
                testID = responseData.testId;
            }

            await renderSavedTestsList();

        } catch (err) { 
            console.error(err);
            alert(err.message); 
        }
    };

    window.renderSavedTestsList = async function () {
        const listContainer = document.getElementById('saved-tests-list');
        const noTestsMsg = document.getElementById('no-saved-tests-msg');
        const token = localStorage.getItem("token");
        listContainer.innerHTML = '';

        try {
            const res = await fetch("/api/tests/userTest", {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (!res.ok) throw new Error("Błąd");

            const savedTests = await res.json();
            console.log("Pobrane testy:", savedTests);
            if (!savedTests.length) {
                noTestsMsg.style.display = 'block';
                noTestsMsg.innerText = t('noSavedTests');
                return;
            }
            noTestsMsg.style.display = 'none';
            
            savedTests.reverse().forEach(test => {
                const id = test.testId || test._id; 

                const isPub = test.isPublic === true;
                
                // Konfiguracja wyglądu przycisku statusu
                const visIcon = isPub ? '🌐' : '🔒';
                const visTitle = isPub ? t('statusPublic') : t('statusPrivate');
                const visClass = isPub ? 'btn-info' : 'btn-secondary'; 

                const item = document.createElement('div');
                item.className = 'list-group-item bg-transparent border-secondary mb-2 rounded p-3';
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="max-width: 55%;">
                            <h6 class="mb-1 fw-bold text-primary text-truncate">${test.title}</h6>
                            <small class="text-muted">${t('questionsCount')}: ${test.numberOfQuestions ?? 0}</small>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button class="btn ${visClass}" onclick="toggleTestStatus('${id}', ${isPub})" title="${visTitle}">
                                ${visIcon}
                            </button>
                            <button class="btn btn-success" onclick="loadTest('${test.testId}')">${t('loadBtn')}</button>
                            <button class="btn btn-outline-danger" onclick="deleteTest('${test.testId}')">${t('deleteBtn')}</button>
                        </div>
                    </div>`;
                listContainer.appendChild(item);
            });
        } catch (err) { console.error(err); }
    };


    // Funkcja do zmieniania statusu testu
    window.toggleTestStatus = async function(id, currentStatus) {
        const token = localStorage.getItem("token");
        const currentLang = localStorage.getItem("language") || 'pl';
        const newStatus = !currentStatus; 

        const messages = {
            pl: {
                public: "Test został upubliczniony 🌐",
                private: "Test jest teraz prywatny 🔒",
                error: "Nie udało się zmienić statusu ❌",
            },
            en: {
                public: "Test is now public 🌐",
                private: "Test is now private 🔒",
                error: "Failed to update status ❌",
            }
        };

        try {
            const res = await fetch(`/api/tests/${id}`, {
                method: "PATCH",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ isPublic: newStatus })
            });


            if (!res.ok) throw new Error("Nie udało się zmienić statusu.");
            
            await renderSavedTestsList(); 
            
            const successMsg = newStatus 
            ? messages[currentLang].public 
            : messages[currentLang].private;

            showToast(successMsg, 'success');

        } catch (err) {
            const errorBase = messages[currentLang].error;
            ShowToast(`${errorBase}`, 'danger');
        }
    };

    function updatePrivacyUI() {
        const toggle = document.getElementById('publicSwitch');
        const icon = document.getElementById('publicIcon');
        const label = document.getElementById('publicLabel');
        const desc = document.getElementById('publicDesc');
        
        const lang = localStorage.getItem('language') || 'pl';
        const txt = dictionary[lang];

        if (toggle.checked) {
            // Stan: PUBLICZNY
            icon.className = 'bi bi-globe me-2 fs-5 text-success'; 
            label.textContent = txt.publicTitle;
            label.className = 'mb-0 fw-bold text-success';
            desc.textContent = txt.publicDesc;
        } else {
            // Stan: PRYWATNY
            icon.className = 'bi bi-lock-fill me-2 fs-5 text-secondary'; 
            label.textContent = txt.privateTitle;
            label.className = 'mb-0 fw-bold text-secondary';
            desc.textContent = txt.privateDesc;
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
    const titleInput = document.getElementById('test-title');
    const publicSwitch = document.getElementById('publicSwitch');
    const publicLabel = document.getElementById('publicLabel');
    const publicDesc = document.getElementById('publicDesc');
    const publicIcon = document.getElementById('publicIcon');

    const texts = {
        pl: {
            locked: "Wpisz tytuł, aby odblokować",
            private: "Prywatny",
            public: "Publiczny",
            privateDesc: "Widoczny tylko dla Ciebie",
            publicDesc: "Widoczny dla wszystkich"
        },
        en: {
            locked: "Enter title to unlock",
            private: "Private",
            public: "Public",
            privateDesc: "Visible only to you",
            publicDesc: "Visible to everyone"
        }
    };

    // Funkcja aktualizująca wygląd
    function updateVisuals() {
        const lang = localStorage.getItem('language') || 'pl';
        const isChecked = publicSwitch.checked;
        const isDisabled = publicSwitch.disabled;

        if (isDisabled) {
            // Stan zablokowany (brak tytułu)
            publicLabel.textContent = texts[lang].private;
            publicLabel.className = "fw-bold"; 
            publicDesc.textContent = texts[lang].locked;
            publicIcon.className = "bi bi-lock-fill ms-2 text-muted";
            publicSwitch.checked = false; 
        } else if (isChecked) {
            // Stan: publiczny
            publicLabel.textContent = texts[lang].public;
            publicLabel.className = "fw-bold text-success";
            publicDesc.textContent = texts[lang].publicDesc;
            publicIcon.className = "bi bi-globe ms-2 text-success";
        } else {
            // Stan: prywatny (ale odblokowany)
            publicLabel.textContent = texts[lang].private;
            publicLabel.className = "fw-bold text-secondary";
            publicDesc.textContent = texts[lang].privateDesc;
            publicIcon.className = "bi bi-lock-fill ms-2 text-secondary";
        }
    }

    function checkTitle() {
        const hasTitle = titleInput.value.trim().length > 0;
        
        publicSwitch.disabled = !hasTitle;
        
        if (!hasTitle) {
            publicSwitch.checked = false;
        }

        updateVisuals();
    }

    titleInput.addEventListener('input', checkTitle);
    publicSwitch.addEventListener('change', updateVisuals);

    checkTitle();
});

    window.loadTest = async function (id) {
    const token = localStorage.token;
    const testTitleInput = document.getElementById('test-title');     
    const publicSwitch = document.getElementById('publicSwitch');     
    const tagsInput = document.getElementById('tagsInput');           

    try {
        const res = await fetch(`/api/tests/${id}`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error(t('errorLoad'));

        const testToLoad = await res.json();
        
        questions = testToLoad.questions;
        
        testTitleInput.value = testToLoad.title;
        
       if(testToLoad.tags) {
            tagsInput.value = Array.isArray(testToLoad.tags) ? testToLoad.tags.join(', ') : testToLoad.tags;
        }

        testID = testToLoad._id;

        testTitleInput.dispatchEvent(new Event('input'));

        publicSwitch.checked = testToLoad.isPublic || false;

        publicSwitch.dispatchEvent(new Event('change'));


        renderQuestionsList();
        checkLimits();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
    } catch (err) { 
        console.error(err);
        alert(t('errorLoad')); 
    }
};

    window.deleteTest = async function(id) {
        if (!confirm(t('alertDeleteConfirm'))) return;
        try {
            const res = await fetch(`/api/tests/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
            });
            if (!res.ok) throw new Error("Błąd");
            renderSavedTestsList();
        } catch (err) { alert(err.message); }
    };

    // --- LOGIKA TESTU ---
    startTestBtn.addEventListener('click', () => {
        quizTitleEl.innerText = testTitleInput.value.trim() || t('userTestTitle');
        creatorSection.classList.add('d-none');
        quizSection.classList.remove('d-none');
        currentQuestionIndex = 0;
        userAnswers = {};
        renderQuizQuestion();
    });

    function renderQuizQuestion() {
        const q = questions[currentQuestionIndex];

        // --- 1. ADAPTER DANYCH (Naprawa starych pytań) ---
        // Naprawa odpowiedzi (A, B...)
        if (!q.answers) {
            q.answers = [];
            if (q.answerA) q.answers.push(q.answerA);
            if (q.answerB) q.answers.push(q.answerB);
            if (q.answerC) q.answers.push(q.answerC);
            if (q.answerD) q.answers.push(q.answerD);
        }
        
        // Naprawa poprawnych odpowiedzi (String -> Array)
        // To nam pozwoli sprawdzić, ile jest poprawnych odpowiedzi
        let correctArr = q.correct;
        if (!Array.isArray(correctArr)) {
            correctArr = [correctArr];
        }
        // ------------------------------------------------

        progressBadge.innerText = `${t('questionProgress')} ${currentQuestionIndex + 1} / ${questions.length}`;
        prevBtn.style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.classList.add('d-none');
            finishBtn.classList.remove('d-none');
        } else {
            nextBtn.classList.remove('d-none');
            finishBtn.classList.add('d-none');
        }

        // --- 2. GENEROWANIE WSKAZÓWKI (HINT) ---
        let hintHtml = '';
        
        if (correctArr.length > 1) {
            // WIELOKROTNY WYBÓR: Wyraźny niebieski pasek (alert)
            hintHtml = `
                <div class="quiz-hint quiz-hint--multi">
                    <span class="quiz-hint-icon">✔✔</span>
                    <span class="quiz-hint-text">${t('hintMultiple')}</span>
                </div>
            `;
        } 

        let optionsHtml = '';
        const currentAns = userAnswers[currentQuestionIndex] || [];

        q.answers.forEach((ansText, index) => {
            const letter = LETTERS[index];
            const isChecked = currentAns.includes(letter) ? 'checked' : '';
            const checkedAttr = isChecked ? 'checked' : '';
            const activeClass = currentAns.includes(letter) ? 'active' : '';

            optionsHtml += `
                <label class="list-group-item d-flex gap-3 align-items-center ${activeClass}" style="cursor: pointer;">
                    <input class="form-check-input" type="checkbox" 
                        value="${letter}" 
                        ${checkedAttr} 
                        onchange="selectAnswer('${letter}', this)">
                    <span><strong>${letter}.</strong> ${ansText}</span>
                </label>`;
        });

        quizContainer.innerHTML = `
            <h5 class="mb-2">${q.question}</h5>
            ${hintHtml}
            <div class="list-group">${optionsHtml}</div>
        `;
    }

    window.selectAnswer = function(value, inputElement) {
        // 1. Inicjalizacja: Upewnij się, że mamy tablicę dla tego pytania
        if (!Array.isArray(userAnswers[currentQuestionIndex])) {
            userAnswers[currentQuestionIndex] = [];
        }

        // 2. Logika dodawania/usuwania
        if (inputElement.checked) {
            
            // Dodaj wartość do tablicy (jeśli jeszcze jej tam nie ma)
            if (!userAnswers[currentQuestionIndex].includes(value)) {
                userAnswers[currentQuestionIndex].push(value);
            }
            
            // Dodaj klasę wizualną 'active' do klikniętego elementu
            inputElement.closest('label').classList.add('active');
            
        } else {
            // Znajdź indeks wartości i usuń ją z tablicy
            const index = userAnswers[currentQuestionIndex].indexOf(value);
            if (index > -1) {
                userAnswers[currentQuestionIndex].splice(index, 1);
            }
            
            inputElement.closest('label').classList.remove('active');
        }
    };

    nextBtn.addEventListener('click', () => { currentQuestionIndex++; renderQuizQuestion(); });
    prevBtn.addEventListener('click', () => { currentQuestionIndex--; renderQuizQuestion(); });
    finishBtn.addEventListener('click', showResults);

    // --- LOGIKA WYNIKÓW ---

    function showResults() {
        quizSection.classList.add('d-none');
        resultsSection.classList.remove('d-none');
        let score = 0;
        resultsList.innerHTML = '';

        questions.forEach((q, index) => {
            // 1. Normalizacja danych
            const userChoiceArr = userAnswers[index] || [];
            const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];

            // --- ADAPTER DLA STARYCH TESTÓW ---
            if (!q.answers || q.answers.length === 0) {
                q.answers = [];
                if (q.answerA) q.answers.push(q.answerA);
                if (q.answerB) q.answers.push(q.answerB);
                if (q.answerC) q.answers.push(q.answerC);
                if (q.answerD) q.answers.push(q.answerD);
            }
            // ----------------------------------

            // 2. Logika porównania
            const userString = JSON.stringify([...userChoiceArr].sort());
            const correctString = JSON.stringify([...correctArr].sort());
            const isCorrect = userString === correctString;

            if (isCorrect) score++;

            // 3. Funkcja pomocnicza do tekstu
            const getText = (letter) => {
                if (!letter) return "";
                const idx = letter.charCodeAt(0) - 65; 
                return q.answers[idx] || "Brak treści";
            };

            // 4. Formatowanie tekstu
            const userText = userChoiceArr.length > 0 
                ? userChoiceArr.map(opt => `<strong>${opt}</strong>: ${getText(opt)}`).join('<br>') 
                : t('noAnswer');
                
            const correctText = correctArr.map(opt => `<strong>${opt}</strong>: ${getText(opt)}`).join('<br>');

            // Generowanie HTML dla wyjaśnienia
            let explanationHtml = '';
            if (q.explanation && q.explanation.trim() !== "") {
                explanationHtml = `
                    <div class="mt-3 pt-3 border-top">
                        <div class="d-flex gap-2">
                            <span class="fs-5">💡</span>
                            <div>
                                <strong class="text-secondary">Wyjaśnienie:</strong><br>
                                <span class="fst-italic">${q.explanation}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 5. Generowanie HTML wyniku
            resultsList.insertAdjacentHTML('beforeend', `
                <div class="card mb-3 result-card ${isCorrect ? 'correct' : 'wrong'}">
                    <div class="card-body">
                        <h5 class="card-title d-flex justify-content-between">
                            <span>${index + 1}. ${q.question}</span>
                            <span>${isCorrect ? '✔️' : '❌'}</span>
                        </h5>
                        
                        <div class="row mt-3">
                            <div class="col-md-6 mb-2">
                                <div class="p-2 border rounded ${isCorrect ? 'bg-success bg-opacity-10 border-success' : 'bg-danger bg-opacity-10 border-danger'}">
                                    <small class="text-uppercase fw-bold" style="font-size: 0.75rem;">${t('yourAnswer')}</small>
                                    <div class="mt-1">${userText}</div>
                                </div>
                            </div>
                            
                            ${!isCorrect ? `
                            <div class="col-md-6 mb-2">
                                <div class="p-2 border rounded bg-success bg-opacity-10 border-success">
                                    <small class="text-uppercase fw-bold" style="font-size: 0.75rem;">${t('correctAnswer')}</small>
                                    <div class="mt-1">${correctText}</div>
                                </div>
                            </div>` : ''}
                        </div>

                        ${explanationHtml} </div>
                </div>`);
        });

        // Obliczanie wyniku końcowego
        const percentage = questions.length > 0 ? Math.round((score / questions.length) * 100) : 0;
        scoreDisplay.innerText = `${percentage}%`;
        scoreDetails.innerText = `${score} z ${questions.length} ${t('correctInfo')}`;
    }

    window.restartQuiz = function() {
        resultsSection.classList.add('d-none');
        quizSection.classList.remove('d-none');
        currentQuestionIndex = 0;
        userAnswers = {};
        renderQuizQuestion();
    };

    window.backToCreator = function() {
        resultsSection.classList.add('d-none');
        creatorSection.classList.remove('d-none');
    };

    setupThemeToggle('toggleTheme');
</script>
