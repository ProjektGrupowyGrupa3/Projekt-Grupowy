<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title data-translate="notificationsTitle">Powiadomienia — LearnIt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/stylesheets/style.css">
  <style>
    .list-group-item.unread {
      background-color: #f0f8ff;
      border-left: 4px solid #007bff;
    }
    .list-group-item.read {
      background-color: #f8f9fa;
    }
    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }
    .notification-comment { background-color: #e3f2fd; }
    .notification-rating { background-color: #e8f5e9; }
    .notification-ranking { background-color: #fff3e0; }
    .notification-reply { background-color: #f3e5f5; }
  </style>
</head>
<body>

<main class="container py-4">
  <h1 class="display-5 mb-4" data-translate="notificationsHeader">
    Powiadomienia
  </h1>

  <div class="row g-4">
    
    <div class="col-lg-4 order-2 order-lg-1">
      <div class="card h-100 border-0 shadow-sm settings-card">
        <div class="card-body">
          <h5 class="mb-3 fw-bold text-uppercase small settings-header" data-translate="notificationSettings">
            Konfiguracja
          </h5>
          
          <div id="settingsAlert" class="alert d-none"></div>
          
          <form id="notificationSettingsForm">
            <div class="vstack gap-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="notifCommentTest" data-setting="comment_test">
                  <label class="form-check-label small" for="notifCommentTest">Komentarze pod testami</label>
                </div>

                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="notifTestRated" data-setting="test_rated">
                  <label class="form-check-label small" for="notifTestRated">Oceny testów</label>
                </div>

                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="notifDifficultyRated" data-setting="difficulty_rated">
                  <label class="form-check-label small" for="notifDifficultyRated">Oceny trudności</label>
                </div>

                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="notifCommentReply" data-setting="comment_reply">
                  <label class="form-check-label small" for="notifCommentReply">Odpowiedzi na komentarze</label>
                </div>
                
                <hr class="my-2" style="border-color: var(--col-contrast);">

                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="emailEnabled" data-setting="emailEnabled">
                  <label class="form-check-label small fw-bold" for="emailEnabled">Powiadomienia Email</label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-sm w-100 mt-4" data-translate="saveSettings">
              Zapisz zmiany
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-8 order-1 order-lg-2">
      <div class="card h-100 border-0 shadow-sm settings-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" data-translate="notificationHistory">Ostatnie powiadomienia</h4>
            <span id="notificationCount" class="badge bg-primary rounded-pill">0</span>
          </div>

          <div id="loadingNotifications" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Ładowanie...</span>
            </div>
            <p class="mt-2 text-muted small">Pobieranie danych...</p>
          </div>

          <div id="notificationsContainer" class="d-none">
            <div id="notificationsList" class="list-group list-group-flush mb-4"></div>
            
            <div class="d-flex gap-2">
              <button id="markAllAsRead" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-check-all"></i> <span data-translate="markAllAsRead">Oznacz wszystkie</span>
              </button>
              <button id="refreshNotifications" class="btn btn-sm btn-outline-primary ms-auto">
                <i class="bi bi-arrow-clockwise"></i> Odśwież
              </button>
            </div>
          </div>
          
          <div id="emptyNotifications" class="d-none text-center py-5 text-muted">
            <i class="bi bi-inbox fs-1 mb-2 d-block opacity-50"></i>
            <span data-translate="noNotifications">Brak nowych powiadomień</span>
          </div>
          
          <div id="errorContainer" class="d-none alert alert-danger mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Twoje skrypty -->
<script src="/static/javascripts/translations.js"></script>
<script src="/static/javascripts/script.js"></script>

<script>
// SELEKTORY (Używamy ID, jest bezpieczniej niż querySelector('.klasa'))
const listElement = document.getElementById('notificationsList');
const containerElement = document.getElementById('notificationsContainer');
const emptyElement = document.getElementById('emptyNotifications');
const loaderElement = document.getElementById('loadingNotifications');
const token = localStorage.getItem('token');

// SPRAWDŹ TOKEN
function checkAuth() {
  if (!token) {
    console.log('Brak tokena – przekierowanie do logowania');
    window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
    return false;
  }
  return true;
}

// FORMATOWANIE DATY
function formatDate(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return 'Przed chwilą';
  if (diffMins < 60) return `${diffMins} min temu`;
  if (diffHours < 24) return `${diffHours} godz. temu`;
  if (diffDays < 7) return `${diffDays} dni temu`;
  
  return date.toLocaleString('pl-PL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// RENDER POWIADOMIEŃ
function renderNotifications(notifications) {
  const listElement = document.getElementById('notificationsList');
  listElement.innerHTML = '';

  notifications.forEach(n => {
    const item = document.createElement('div');
    item.className = 'list-group-item list-group-item-action p-3';

    // Logika stylów dla nieprzeczytanych 
    if (!n.read) {
        item.classList.add('notification-unread');
    } else {
        item.classList.add('opacity-75');
    }

    // --- Generowanie przycisku (bez zmian) ---
    let actionButton = '';
    let customContent = ''; 
    const testTitle = (n.data && n.data.testTitle) ? `"${n.data.testTitle}"` : 'Twój test';

    // 1. Logika dla oceny testu (Gwiazdki)
    if (n.type === 'test_rated' && n.data && n.data.ratingValue) {
        const stars = Array(5).fill(0).map((_, i) => 
            `<i class="bi ${i < n.data.ratingValue ? 'bi-star-fill text-warning' : 'bi-star text-muted'}"></i>`
        ).join('');

        customContent = `
            <div>
                <span class="fw-bold text-primary">${n.data.raterName}</span> ocenił test 
                <span class="fw-bold">${testTitle}</span>:
                <div class="mt-1 fs-5">${stars}</div>
            </div>
        `;
    } 
    
    // 2. Logika dla oceny trudności testu
    else if (n.type === 'difficulty_rated' && n.data && n.data.ratingValue) {
        const diffLabels = { 1: 'Łatwy', 2: 'Średni', 3: 'Trudny' };
        const diffColors = { 1: 'text-success', 2: 'text-warning', 3: 'text-danger' };
        
        const label = diffLabels[n.data.ratingValue];
        const color = diffColors[n.data.ratingValue];

        customContent = `
            <div>
                <span class="fw-bold text-primary">${n.data.raterName}</span> ocenił trudność testu
                <span class="fw-bold">${testTitle}</span> jako:
                <span class="fw-bold ${color} ms-1 text-uppercase">${label}</span>
            </div>
        `;
    }

    
    // 3. Standardowa logika dla reszty (Komentarze, Ranking)
    
    else if (n.targetId) { 
      const lang = localStorage.getItem('language') || 'pl';
      let url = `/user-test-details?testId=${n.targetId}&lang=${lang}`;
      
      if (!customContent) {
        if (['comment_test', 'comment_reply'].includes(n.type)) {
          url += '&showComments=true';
          if (n.contentId) url += `&commentId=${n.contentId}`;
        } else if (n.type === 'ranking') {
          url = '/rank';
        }
        actionButton = `<a href="${url}" class="btn btn-sm btn-outline-primary ms-3">Zobacz</a>`;
      }
    }

    let finalBody = '';
    
    if (customContent) {
        finalBody = customContent;
    } else {
        const textStyle = n.read ? '' : 'fw-bold';
        const texts = {
          'comment_test': '💬 Nowy komentarz pod Twoim testem',
          'ranking': '🏆 Aktualizacja rankingu tygodniowego',
          'comment_reply': '↩️ Odpowiedź na Twój komentarz',
          'test_rated': '⭐ Twój test został oceniony',
          'difficulty_rated': '📊 Oceniono trudność Twojego testu'
        };
        finalBody = `<div class="mb-1 ${textStyle}">${texts[n.type] || 'Nowe powiadomienie'}</div>`;
    }

    // Czerwona kropka
    const unreadIcon = !n.read ? `<i class="bi bi-circle-fill text-danger me-2 unread-dot"></i>` : '';

    item.innerHTML = `
      <div class="d-flex w-100 justify-content-between align-items-center">
        <div>
            <div class="d-flex align-items-center">
                ${unreadIcon}
                ${finalBody}
            </div>
            <small class="notification-time">${formatDate(n.createdAt)}</small>
        </div>
        ${actionButton}
      </div>
    `;

    item.addEventListener('click', () => {
        if (!n.read) markAsRead(n._id, item);
    });

    listElement.appendChild(item);
  });
}

// OZNACZ JAKO PRZECZYTANE (pojedyncze)
async function markAsRead(id, element) {
  // Jeśli element nie ma klasy unread, to znaczy że już obsłużony
  if (!element.classList.contains('notification-unread')) return;

  try {
    await fetch(`/api/notification/${id}/read`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    });
    
    // 1. Zdejmij klasę wizualną tła
    element.classList.remove('notification-unread');
    element.classList.add('opacity-75');
    
    // 2. Usuń pogrubienie tekstu
    const textDiv = element.querySelector('.fw-bold');
    if(textDiv) textDiv.classList.remove('fw-bold');

    // 3. Usuń czerwoną kropkę
    const dot = element.querySelector('.unread-dot');
    if (dot) dot.remove();

    // 4. Aktualizuj licznik (badge)
    const countBadge = document.getElementById('notificationCount');
    const currentCount = parseInt(countBadge.innerText) || 0;
    if (currentCount > 0) countBadge.innerText = currentCount - 1;

    updateUserMenuBadge();
  } catch (err) {
    console.error('Błąd:', err);
  }
}

// ZAŁADUJ POWIADOMIENIA
async function loadNotifications() {
  if (!checkAuth()) return;

  try {
    const res = await fetch('/api/notification', {
      headers: { Authorization: `Bearer ${token}`, 'Cache-Control': 'no-cache' }
    });
    
    if (!res.ok) throw new Error('Błąd fetch');

    let allNotifications = await res.json();
    const limitedNotifications = allNotifications.slice(0, 10);
    
    // Ukryj loader
    loaderElement.classList.add('d-none');

    if (limitedNotifications.length > 0) {
      containerElement.classList.remove('d-none');
      emptyElement.classList.add('d-none');
      renderNotifications(limitedNotifications);
      
      // Aktualizuj licznik
      const unreadCount = allNotifications.filter(n => !n.read).length;
      document.getElementById('notificationCount').innerText = unreadCount;
    } else {
      // BRAK powiadomień: Ukryj kontener, pokaż "pusty stan"
      containerElement.classList.add('d-none');
      emptyElement.classList.remove('d-none');
    }

  } catch (err) {
    console.error('Błąd ładowania powiadomień:', err);
    loaderElement.classList.add('d-none');
    const errCont = document.getElementById('errorContainer');
    errCont.innerText = "Nie udało się pobrać danych.";
    errCont.classList.remove('d-none');
  }
}

// OZNACZ JAKO PRZECZYTANE (pojedyncze)
async function markAsRead(id, element) {
  if (!element.classList.contains('notification-unread')) return;

  try {
    await fetch(`/api/notification/${id}/read`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    });
    
    element.classList.remove('notification-unread');
    element.classList.add('opacity-75'); 

    const textDiv = element.querySelector('.fw-bold');
    if(textDiv) textDiv.classList.remove('fw-bold');
    
    // Aktualizuj licznik
    const countBadge = document.getElementById('notificationCount');
    const currentCount = parseInt(countBadge.innerText) || 0;
    if (currentCount > 0) countBadge.innerText = currentCount - 1;

    updateUserMenuBadge();
  } catch (err) {
    console.error('Błąd oznaczania jako przeczytane:', err);
  }
}

// OZNACZ WSZYSTKIE JAKO PRZECZYTANE
document.getElementById('markAllAsRead').addEventListener('click', async () => {
  try {
    await fetch('/api/notification/read-all', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
    document.querySelectorAll('.list-group-item').forEach(el => el.classList.remove('fw-bold', 'bg-light'));
    
    // Wyzeruj licznik
    document.getElementById('notificationCount').innerText = '0';
    updateUserMenuBadge();
    
  } catch (err) {
    console.error('Błąd oznaczania wszystkich jako przeczytane:', err);
  }
});

// Odświeżanie przyciskiem
document.getElementById('refreshNotifications').addEventListener('click', () => {
    loaderElement.classList.remove('d-none');
    containerElement.classList.add('d-none');
    emptyElement.classList.add('d-none');
    loadNotifications();
});


// ŁADUJ USTAWIENIA
async function loadSettings() {
  if (!checkAuth()) return;

  try {
    const res = await fetch('/api/notification/settings', {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('Błąd fetch ustawień');

    const settings = await res.json();
    document.querySelectorAll('[data-setting]').forEach(cb => {
      // Jeśli ustawienie istnieje w bazie, ustaw checkbox. Jeśli nie, uznaj true (domyślnie włączone)
      const val = settings[cb.dataset.setting];
      cb.checked = val !== undefined ? val : true;
    });

  } catch (err) {
    console.error('Błąd ładowania ustawień:', err);
  }
}

// ZAPIS USTAWIEŃ – przy zmianie checkboxa
document.querySelectorAll('[data-setting]').forEach(cb => {
  cb.addEventListener('change', () => {
    // Pokaż mały alert/feedback (opcjonalnie)
    const alertBox = document.getElementById('settingsAlert');
    
    fetch('/api/notification/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ [cb.dataset.setting]: cb.checked })
    })
    .then(() => {
        // Feedback wizualny
        alertBox.className = "alert alert-success py-2 mb-3";
        alertBox.innerText = "Zapisano!";
        setTimeout(() => alertBox.classList.add('d-none'), 2000);
    })
    .catch(err => {
        console.error('Błąd zapisu ustawień:', err);
        cb.checked = !cb.checked; 
    });
  });
});

// INIT
if (token) {
  loadSettings();
  loadNotifications();
}
</script>
</body>
</html>
