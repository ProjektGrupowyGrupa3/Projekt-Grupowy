<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title data-translate="notificationsTitle">Powiadomienia — LearnIt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/stylesheets/style.css">
  <style>
    .list-group-item.unread {
      background-color: #f0f8ff;
      border-left: 4px solid #007bff;
    }
    .list-group-item.read {
      background-color: #f8f9fa;
    }
    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }
    .notification-comment { background-color: #e3f2fd; }
    .notification-rating { background-color: #e8f5e9; }
    .notification-ranking { background-color: #fff3e0; }
    .notification-reply { background-color: #f3e5f5; }
  </style>
</head>
<body>

<main class="container py-4">
  <h1 class="display-5 mb-4" data-translate="notificationsHeader">
    Powiadomienia
  </h1>

  <div class="row g-4">
    <!-- USTAWIENIA -->
    <div class="col-lg-6">
      <div class="card h-100">
        <div class="card-body">
          <h4 class="mb-3" data-translate="notificationSettings">Ustawienia powiadomień</h4>
          
          <div id="settingsAlert" class="alert d-none"></div>
          
          <form id="notificationSettingsForm">
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="notifCommentTest" 
                     data-setting="comment_test" name="comment_test">
              <label class="form-check-label" for="notifCommentTest" data-translate="notifCommentTest">
                Nowy komentarz pod Twoim testem
              </label>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="notifTestRated" 
                     data-setting="test_rated" name="test_rated">
              <label class="form-check-label" for="notifTestRated" data-translate="notifTestRated">
                Twój test został oceniony
              </label>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="notifRanking" 
                     data-setting="ranking" name="ranking">
              <label class="form-check-label" for="notifRanking" data-translate="notifRanking">
                Aktualizacja rankingu tygodniowego
              </label>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="notifCommentReply" 
                     data-setting="comment_reply" name="comment_reply">
              <label class="form-check-label" for="notifCommentReply" data-translate="notifCommentReply">
                Odpowiedź na Twój komentarz
              </label>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="emailEnabled" 
                     data-setting="emailEnabled" name="emailEnabled">
              <label class="form-check-label" for="emailEnabled">
                Powiadomienia email
              </label>
            </div>

            <hr>
            <button type="submit" class="btn btn-primary mt-3 w-100" id="saveNotificationSettings"
                    data-translate="saveSettings">
              Zapisz ustawienia
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- HISTORIA POWIADOMIEŃ -->
    <div class="col-lg-6">
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0" data-translate="notificationHistory">Historia powiadomień</h4>
            <span id="notificationCount" class="badge bg-primary">0</span>
          </div>

          <div id="loadingNotifications" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Ładowanie...</span>
            </div>
            <p class="mt-2 text-muted">Ładowanie powiadomień...</p>
          </div>

          <div id="notificationsContainer" class="d-none">
            <div id="notificationsList" class="list-group mb-3"></div>
            
            <div class="d-flex justify-content-between">
              <button id="markAllAsRead" class="btn btn-secondary"
                      data-translate="markAllAsRead">
                Oznacz wszystkie jako przeczytane
              </button>
              <button id="refreshNotifications" class="btn btn-outline-primary">
                <i class="bi bi-arrow-clockwise"></i> Odśwież
              </button>
            </div>
          </div>
          
          <div id="emptyNotifications" class="d-none text-center py-4">
            <i class="bi bi-bell-slash fs-1 text-muted"></i>
            <p class="mt-2" data-translate="noNotifications">Brak powiadomień</p>
          </div>
          
          <div id="errorContainer" class="d-none alert alert-danger"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Twoje skrypty -->
<script src="/static/javascripts/translations.js"></script>
<script src="/static/javascripts/script.js"></script>

<script>

// GLOBALNE ZMIENNE
let currentNotifications = [];
const notificationsContainer = document.querySelector('.list-group');
const token = localStorage.getItem('token');


// SPRAWDŹ TOKEN
function checkAuth() {
  if (!token) {
    console.log('Brak tokena – przekierowanie do logowania');
    window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
    return false;
  }
  return true;
}


// FORMATOWANIE DATY
function formatDate(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return 'Przed chwilą';
  if (diffMins < 60) return `${diffMins} min temu`;
  if (diffHours < 24) return `${diffHours} godz. temu`;
  if (diffDays < 7) return `${diffDays} dni temu`;
  
  return date.toLocaleString('pl-PL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}


// RENDER POWIADOMIEŃ
function renderNotifications(notifications) {
  notificationsContainer.innerHTML = '';

  if (!notifications.length) {
    notificationsContainer.innerHTML = `
      <div class="list-group-item text-center text-muted" data-translate="noNotifications">
        Brak powiadomień
      </div>`;
    return;
  }

  notifications.forEach(n => addNotificationToDOM(n));
}


// DODAJ POWIADOMIENIE DO DOM
function addNotificationToDOM(notification) {
  const item = document.createElement('div');
  item.className = 'list-group-item';
  if (!notification.read) item.classList.add('fw-bold');
  item.dataset.id = notification._id;

  // Tekst powiadomienia bazowany na typie
  const texts = {
    'comment_test': 'Nowy komentarz pod Twoim testem',
    'test_rated': 'Twój test został oceniony',
    'ranking': 'Aktualizacja rankingu',
    'comment_reply': 'Odpowiedź na Twój komentarz'
  };
  const text = texts[notification.type] || 'Nowe powiadomienie';

  item.innerHTML = `
    <strong>${text}</strong>
    <div class="small text-muted">${formatDate(notification.createdAt)}</div>
  `;

  item.addEventListener('click', () => markAsRead(notification._id, item));

  notificationsContainer.prepend(item);
}


// ZAŁADUJ POWIADOMIENIA
async function loadNotifications() {
  if (!checkAuth()) return;

  try {
    const res = await fetch('/api/notification', {
      headers: { Authorization: `Bearer ${token}`, 'Cache-Control': 'no-cache' }
    });
    if (!res.ok) throw new Error('Błąd fetch');

    currentNotifications = await res.json();
    renderNotifications(currentNotifications);

  } catch (err) {
    console.error('Błąd ładowania powiadomień:', err);
    notificationsContainer.innerHTML = `
      <div class="list-group-item text-center text-danger">
        Nie udało się załadować powiadomień
      </div>`;
  } finally {
    // ukryj loader
    document.getElementById('loadingNotifications').classList.add('d-none');
  }
}


// OZNACZ JAKO PRZECZYTANE (pojedyncze)
async function markAsRead(id, element) {
  try {
    await fetch(`/api/notification/${id}/read`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    });
    element.classList.remove('fw-bold');

  } catch (err) {
    console.error('Błąd oznaczania jako przeczytane:', err);
  }
}


// OZNACZ WSZYSTKIE JAKO PRZECZYTANE
document.querySelector('[data-translate="markAllAsRead"]').addEventListener('click', async () => {
  try {
    await fetch('/api/notification/read-all', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
    document.querySelectorAll('.list-group-item.fw-bold').forEach(el => el.classList.remove('fw-bold'));
  } catch (err) {
    console.error('Błąd oznaczania wszystkich jako przeczytane:', err);
  }
});


// ŁADUJ USTAWIENIA
async function loadSettings() {
  if (!checkAuth()) return;

  try {
    const res = await fetch('/api/notification/settings', {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('Błąd fetch ustawień');

    const settings = await res.json();
    document.querySelectorAll('[data-setting]').forEach(cb => {
      cb.checked = !!settings[cb.dataset.setting];
    });

  } catch (err) {
    console.error('Błąd ładowania ustawień:', err);
  }
}

// ZAPIS USTAWIEŃ – przy zmianie checkboxa
document.querySelectorAll('[data-setting]').forEach(cb => {
  cb.addEventListener('change', () => {
    fetch('/api/notification/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ [cb.dataset.setting]: cb.checked })
    }).catch(err => console.error('Błąd zapisu ustawień:', err));
  });
});


if (token) {
  loadSettings();
  loadNotifications();

  // automatyczne odświeżanie co 30 sek
  setInterval(() => {
    if (document.visibilityState === 'visible') loadNotifications();
  }, 30000);
}

</script>
</body>
</html>
