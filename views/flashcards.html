<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fiszki — nauka</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/stylesheets/style.css">
  <link rel="stylesheet" href="static/stylesheets/flashcards.css">
</head>
<body>
  <div class="container py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-start justify-content-between mb-3 gap-3">
          <div>
            <h1 class="h4 mb-1" data-translate="title">Fiszki — twórz i ucz się</h1>
            <div class="text-muted small" data-translate="subtitle">Twórz pytania i odpowiedzi, potem ucz się w sesjach.</div>
          </div>
          <div class="d-flex gap-2">
            <button id="shuffleBtn" class="btn btn-outline-secondary" data-translate="shuffleBtn">Przemieszaj</button>
            <button id="startBtn" class="btn btn-primary" data-translate="startBtn">Start nauki</button>
          </div>
        </div>

        <div class="row g-3">
          <!-- lewa kolumna: formularz i lista fiszek (widoczna przy tworzeniu) -->
          <div class="col-lg-6" id="cardsColumn">
            <form id="addForm" class="card p-3 mb-3">
              <div class="mb-2">
                <label for="q" class="form-label small text-secondary" data-translate="questionLabel">Pytanie</label>
                <textarea id="q" class="form-control" required></textarea>
              </div>
              <div class="mb-2">
                <label for="a" class="form-label small text-secondary" data-translate="answerLabel">Odpowiedź</label>
                <textarea id="a" class="form-control" required></textarea>
              </div>
              <div class="d-flex gap-2 justify-content-end mt-2">
                <button id="addBtn" type="submit" class="btn btn-success" data-translate="addBtn">Dodaj fiszkę</button>
                <button id="clearAll" type="button" class="btn btn-danger" data-translate="clearAllBtn">Usuń wszystkie</button>
              </div>
            </form>

            <div class="card p-3">
              <div class="small text-muted mb-2" data-translate="yourFlashcards">Twoje fiszki</div>
              <div id="cardsList" class="row g-2"></div>
            </div>
          </div>

          <!-- prawa kolumna: tryb nauki (domyślnie niewidoczny, pokaż po Start) -->
          <div class="col-lg-6 d-none" id="studyColumn">
            <div class="card p-3 h-100 d-flex flex-column">
              <div class="mb-2">
                <div class="small text-muted" data-translate="studyMode">Tryb nauki</div>
                <div class="small text-muted" data-translate="instruction">Kliknij kartę żeby odsłonić odpowiedź; następnie oznacz "Zapamiętałem" lub "Powtórz".</div>
              </div>

              <!-- panel z kartą (pełna wysokość) -->
              <div id="studyArea" class="flex-grow-1 d-none">
                <div id="currentCard" class="card h-100 d-flex align-items-center justify-content-center border-0">
                  <div class="text-center p-3">
                    <div id="stateInfo" class="small text-muted mb-2"></div>
                    <div id="questionArea" class="h5 fw-semibold mb-2" style="cursor:pointer" data-translate="">Brak kart do nauki</div>
                    <div id="answerArea" class="small text-muted" style="display:none"></div>
                  </div>
                </div>

                <div id="sessionSummary" class="mt-3 text-center text-primary d-none"></div>
              </div>

              <div id="controls" class="d-none mt-3">
                <div class="d-flex gap-2 justify-content-center controls-inner">
                  <button id="rememberBtn" class="btn btn-success" data-translate="rememberBtn">Zapamiętałem</button>
                  <button id="repeatBtn" class="btn btn-outline-secondary" data-translate="repeatBtn">Powtórz</button>
                </div>
              </div>

              <div id="noCards" class="text-center text-muted mt-auto small" data-translate="noCardMessage">Brak aktywnej sesji. Dodaj fiszki lub naciśnij Start.</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="static/javascripts/translations.js"></script>
  <script src="static/javascripts/script.js"></script>
  <script>
    setupThemeToggle('toggleTheme');
  </script>
  <script src="static/javascripts/flashcardsScript.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
