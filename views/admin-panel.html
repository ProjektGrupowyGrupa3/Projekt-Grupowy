<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administratora — LearnIt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/stylesheets/style.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">LearnIt</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/quiz/test">Test</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz/learn">Tryb nauki</a></li>
        <li class="nav-item"><a class="nav-link active" href="/adminPanel.html">Admin</a></li>
      </ul>

      <div class="d-flex align-items-center">
        <button id="toggleTheme" class="btn btn-outline-light me-2">Toggle Dark/Light</button>
        <span id="userEmail" class="me-3"></span>
        <a id="authBtn" class="btn btn-outline-light me-2" href="/login">Zaloguj</a>
        <a id="regBtn" class="btn btn-secondary" href="/register">Rejestracja</a>
      </div>

      <div class="language-switcher">
        <button onclick="changeLanguage('pl')" class="btn btn-primary">PL</button>
        <button onclick="changeLanguage('en')" class="btn btn-primary">EN</button>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">

  <h2 class="mb-4">Panel Administratora</h2>

  <!-- Zakładki -->
  <ul class="nav nav-tabs" id="adminTabs">
    <li class="nav-item"><button class="nav-link active" data-tab="reports">Zgłoszenia</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="users">Użytkownicy</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="questions">Pytania</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="comments">Komentarze</button></li>
  </ul>

  <!-- Sekcje -->
  <div id="tabContent" class="mt-4">
    
    <!-- Zgłoszenia -->
    <div class="admin-tab" id="tab-reports">
      <h4>Zgłoszenia komentarzy</h4>
      <div id="reportsContainer"></div>
    </div>

    <!-- Użytkownicy -->
    <div class="admin-tab d-none" id="tab-users">
      <h4>Zarządzanie użytkownikami</h4>
      <div id="usersContainer"></div>
    </div>

    <!-- Pytania -->
    <div class="admin-tab d-none" id="tab-questions">
      <h4>Zarządzanie pytaniami</h4>

      <button id="addQuestionBtn" class="btn btn-primary mb-3">Dodaj pytanie</button>

      <div id="questionsContainer"></div>
    </div>

    <!-- komentarze -->
    <div class="admin-tab d-none" id="tab-comments">
      <h4>Wszystkie komentarze</h4>
      <div id="commentsContainer"></div>
    </div>

  </div>
</main>

<script>
// Przykładowe dane
const mockReports = [
  { id:1, reporter:"User1", text:"Ten komentarz obraża", comment:"Ale słaby test...", user:"ToxicGuy" },
  { id:2, reporter:"User2", text:"Spam", comment:"Kupujcie bitcoina!!!!!", user:"CryptoBro" }
];

const mockUsers = [
  { id:1, email:"admin@example.com", role:"admin", blocked:false },
  { id:2, email:"user1@example.com", role:"user", blocked:false },
  { id:3, email:"troll@example.com", role:"user", blocked:true }
];

const mockQuestions = [
  { id:1, subject:"Matematyka", text:"Ile to 2+2?" },
  { id:2, subject:"Fizyka", text:"Prawo Ohma to?" }
];

const mockComments = [
  { id:1, user:"User1", text:"Super test!", parent:false },
  { id:2, user:"Troll", text:"Głupota totalna", parent:false }
];

// Zakładki
document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.admin-tab').forEach(tab=>tab.classList.add('d-none'));
    document.getElementById('tab-'+btn.dataset.tab).classList.remove('d-none');
  });
});

// Render zgłoszeń
function renderReports(){
  const box=document.getElementById('reportsContainer');
  box.innerHTML="";
  mockReports.forEach(r=>{
    const div=document.createElement('div');
    div.className="card mb-3";
    div.innerHTML=`
      <div class="card-body">
        <p><strong>Zgłaszający:</strong> ${r.reporter}</p>
        <p><strong>Komentarz:</strong> ${r.comment}</p>
        <p><strongPowód:</strong> ${r.text}</p>
        <button class="btn btn-danger btn-sm">Usuń komentarz</button>
        <button class="btn btn-secondary btn-sm">Odrzuć zgłoszenie</button>
      </div>`;
    box.appendChild(div);
  });
}

// Render użytkowników
function renderUsers(){
  const box=document.getElementById('usersContainer');
  box.innerHTML="";
  mockUsers.forEach(u=>{
    const div=document.createElement('div');
    div.className="card mb-2";
    div.innerHTML=`
      <div class="card-body d-flex justify-content-between align-items-center">
        <span>${u.email}</span>
        <div>
          <select class="form-select form-select-sm roleSelect" data-id="${u.id}">
            <option value="user" ${u.role==="user"?"selected":""}>Użytkownik</option>
            <option value="admin" ${u.role==="admin"?"selected":""}>Administrator</option>
          </select>
          <button class="btn btn-warning btn-sm mt-2 blockBtn" data-id="${u.id}">
            ${u.blocked ? "Odblokuj" : "Zablokuj"}
          </button>
          <button class="btn btn-danger btn-sm mt-2 deleteUserBtn" data-id="${u.id}">Usuń</button>
        </div>
      </div>`;
    box.appendChild(div);
  });
}

// Render pytań
function renderQuestions(){
  const box=document.getElementById('questionsContainer');
  box.innerHTML="";
  mockQuestions.forEach(q=>{
    const div=document.createElement('div');
    div.className="card mb-2";
    div.innerHTML=`
      <div class="card-body">
        <strong>${q.subject}</strong>: ${q.text}
        <div class="mt-2">
          <button class="btn btn-primary btn-sm me-2">Edytuj</button>
          <button class="btn btn-danger btn-sm">Usuń</button>
        </div>
      </div>`;
    box.appendChild(div);
  });
}

// Render komentarzy
function renderComments(){
  const box=document.getElementById('commentsContainer');
  box.innerHTML="";
  mockComments.forEach(c=>{
    const div=document.createElement('div');
    div.className="card mb-2";
    div.innerHTML=`
      <div class="card-body">
        <strong>${c.user}</strong>: ${c.text}
        <button class="btn btn-danger btn-sm mt-2">Usuń komentarz</button>
      </div>`;
    box.appendChild(div);
  });
}

// Uruchomienie
document.addEventListener('DOMContentLoaded',()=>{
  renderReports();
  renderUsers();
  renderQuestions();
  renderComments();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
