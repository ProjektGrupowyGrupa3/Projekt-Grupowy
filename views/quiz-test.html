<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tryb Test — LearnIt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/stylesheets/style.css">
</head>
<body>
<main class="container py-4" id="protectedContent" style="display: none;">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <h3 data-translate="title">Tryb testu</h3>
      <form id="settingsForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label" data-translate="subject">Przedmiot</label>
          <select id="subject" class="form-select">
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" data-translate="numberOfQuestions">Ilość pytań</label>
          <input type="number" id="count" class="form-control" min="1" max="50" value="5">
        </div>
        <div class="col-md-4">
          <label class="form-label" data-translate="time">Czas (minuty)</label>
          <input type="number" id="time" class="form-control" min="1" max="120" value="10">
        </div>
        <div class="col-12">
          <button class="btn btn-primary" id="startBtn" type="button" data-translate="startButton">Rozpocznij test</button>
        </div>
      </form>

      <div id="quizArea" class="mt-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>Timer: <span id="timer">15:00</span></div>
          <div>
            <span data-translate="question">Pytanie</span> 
            <span id="curIdx">0</span>/<span id="total">0</span>
          </div>
        </div>
        <div id="questionCard" class="card">
          <div class="card-body">
            <h5 id="questionText"></h5>
            <div id="answers" class="list-group mt-3"></div>
          </div>
        </div>
        <div class="mt-3 d-flex justify-content-between">
          <button id="prevBtn" class="btn btn-outline-secondary" data-translate="previousQuestion">Poprzednie</button>
          <button id="nextBtn" class="btn btn-primary" data-translate="nextQuestion">Następne</button>
        </div>
      </div>

      <div id="resultArea" class="mt-4 d-none"></div>
    </div>
  </div>
</main>


<script>
document.addEventListener('DOMContentLoaded', initQuizTest);

// Nasłuchiwanie na globalną zmianę języka
document.addEventListener('languageChanged', (e) => {
    const newLang = e.detail.newLang;
    console.log(`Język zmieniony na ${newLang}. Odświeżam przedmioty...`);
    loadAndRenderSubjects(newLang);
    resetQuizState();
});

async function loadAndRenderSubjects(lang) {
    const subjectSelect = document.getElementById('subject');
    const selectedLang = lang || 'pl'; 
    
    console.log(`Pobieranie przedmiotów dla języka: ${selectedLang}`);

    if (!subjectSelect) return;

    subjectSelect.innerHTML = '<option disabled selected>Wczytywanie...</option>';

    try {
      const res = await fetch(`/api/subjects?lang=${selectedLang}`);
      
      if (!res.ok) throw new Error(`Błąd HTTP: ${res.status}`);
      
      const subjects = await res.json();
      console.log('Pobrane przedmioty:', subjects);

      subjectSelect.innerHTML = ''; 

      if (!subjects || subjects.length === 0) {
        subjectSelect.innerHTML = '<option value="">Brak przedmiotów w bazie</option>';
        return;
      }

      subjects.forEach(subj => {
        const option = document.createElement('option');
        option.value = subj._id;
        option.textContent = `${subj.name} (sem. ${subj.semester})`;
        subjectSelect.appendChild(option);
      });

    } catch (err) {
      console.error('Błąd podczas pobierania przedmiotów:', err);
      subjectSelect.innerHTML = '<option value="">Błąd połączenia z bazą</option>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('protectedContent').style.display = 'block';
        }
    });

async function initQuizTest() {
  const subjectSelect = document.getElementById('subject');
  const startBtn = document.getElementById('startBtn');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');

  const state = {
    questions: [],
    answers: [],
    cur: 0,
    timer: null,
    timeLeft: 0
  };

  const currentLang = localStorage.getItem('language') || 'pl';
  await loadAndRenderSubjects(currentLang);

  
  startBtn.addEventListener('click', async () => {
    const subj = subjectSelect.value;
    const cnt = parseInt(document.getElementById('count').value) || 5;
    const mins = parseInt(document.getElementById('time').value) || 10;

    if (!subj) {
      alert('❗ Wybierz przedmiot.');
      return;
    }

    state.testId = subj;

    let pool = [];
    try {
      var PolEng = "pol";
      if(localStorage.getItem('language')=="en"){
        PolEng = "eng"
      }
      const token = localStorage.getItem('token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      const res = await fetch(`/api/questions?subject=${encodeURIComponent(subj)}&mode=random&limit=${cnt}`, { headers });
      if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);
      const { questions } = await res.json();
      pool = questions;
    } catch (err) {
      console.warn(' Błąd pobierania z API, używam przykładowych danych:', err);
      pool = [];
    }

    if (!pool.length) {
      alert('Brak pytań dla wybranego przedmiotu.');
      return;
    }


    state.questions = pool;
    state.answers = Array(pool.length).fill(null);
    state.cur = 0;
    state.timeLeft = mins * 60;

    document.getElementById('quizArea').classList.remove('d-none');
    document.getElementById('resultArea').classList.add('d-none');
    document.getElementById('total').textContent = pool.length;
    renderQuestion(state);

    if (state.timer) clearInterval(state.timer);
    state.timer = setInterval(() => {
      state.timeLeft--;
      updateTimer(state);
      if (state.timeLeft <= 0) {
        clearInterval(state.timer);
        finishTest(state);
      }
    }, 1000);
    updateTimer(state);
  });

  
  prevBtn.addEventListener('click', () => {
    if (state.cur > 0) {
      state.cur--;
      renderQuestion(state);
      highlightSelected(state);
    }
  });

  
  nextBtn.addEventListener('click', () => {
    if (state.cur < state.questions.length - 1) {
      state.cur++;
      renderQuestion(state);
      highlightSelected(state);
    } else {
      finishTest(state);
    }
  });
}


function updateTimer(state) {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

async function addPointsAPI(type, amount, questionId) {
      try {
          const token = localStorage.getItem("token");

          const res = await fetch("/api/points/add", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + token
              },
              body: JSON.stringify({ type, amount, questionId })
          });

          return await res.json();
          
      } catch (err) {
          console.error("❌ Błąd API:", err);
      }
  }



function renderQuestion(state) {
  const q = state.questions[state.cur];
  document.getElementById('questionText').textContent = q.question || 'Brak pytania';
  const answers = document.getElementById('answers');
  answers.innerHTML = '';

  const opts = q.answers?.map(a => a.text) || [];
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'list-group-item list-group-item-action';
    btn.textContent = opt;
    btn.onclick = () => {
      state.answers[state.cur] = i;
      [...answers.children].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    answers.appendChild(btn);
  });

  document.getElementById('curIdx').textContent = state.cur + 1;
}


function highlightSelected(state) {
  const selected = state.answers[state.cur];
  const btns = document.getElementById('answers').children;
  if (selected !== null && btns[selected]) btns[selected].classList.add('active');
}

// Wysyłanie wyniku do bazy (statystyki) 
async function saveTestResultAPI(data) {
    try {
        const token = localStorage.getItem("token");
        const res = await fetch("/quiz/test/save-result", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error("Błąd zapisu wyniku");
        return await res.json();
    } catch (err) {
        console.error("❌ Nie udało się zapisać historii testu:", err);
    }
}

async function finishTest(state) {
  if (state.timer) clearInterval(state.timer);

  let correct = 0;

  state.questions.forEach((q, i) => {
    const ans = state.answers[i];
    const correctIndex = q.answers?.findIndex(a => a.isCorrect);
    
    if (ans === correctIndex) correct++;
  });

  const percent = Math.round((correct / state.questions.length) * 100);

  // Zapisanie wyniku w bazie 
  const resultData = {
      subjectId: state.testId,
      score: percent,
      totalQuestions: state.questions.length,
      correctAnswers: correct,
  };

  const savedResult = await saveTestResultAPI(resultData);
  const resultId = savedResult && savedResult.resultId ? savedResult.resultId : state.testId;
  
  const res = document.getElementById('resultArea');
  res.classList.remove('d-none');
  
  let alertClass = percent > 50 ? 'alert-info' : 'alert-warning';
  
  res.innerHTML = `
    <div class="alert ${alertClass} text-center">
      <h4>🎓 Wynik testu</h4>
      <p>Poprawne odpowiedzi: <strong>${correct}</strong> / ${state.questions.length}</p>
      <p>Wynik procentowy: <strong>${percent}%</strong></p>
    </div>
  `;


  // 4. Naliczanie punktów (UserEarnedAction) - tylko gdy > 50%
  try {
    if (percent > 50) {
      await addPointsAPI("test_passed", 20, resultId);
      
      // Aktualizacja licznika w navbarze
      if (typeof updateUserPointsUI === 'function') {
        updateUserPointsUI(20);
      }  
      
      res.innerHTML += `
        <div class="alert alert-success text-center mt-3">
          🎉 Gratulacje! Zdobywasz <strong>20 punktów</strong> za zaliczenie testu!
        </div>
      `;
    } else {
      res.innerHTML += `
        <div class="alert alert-secondary text-center mt-3">
          😞 Wynik poniżej 50% — punkty nie zostały przyznane. Spróbuj ponownie!
        </div>
      `;
    }
  } catch (err) {
    console.error("Błąd naliczania punktów:", err);
    res.innerHTML += `
      <div class="alert alert-danger text-center mt-3">
        ⚠️ Wynik zapisany, ale wystąpił problem z naliczeniem punktów.
      </div>
    `;
  }
  
  document.getElementById('quizArea').classList.add('d-none');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/javascripts/translations.js"></script>
<script src="/static/javascripts/script.js"></script>
</body>
</html>
