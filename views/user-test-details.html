<!DOCTYPE html>
<html lang="pl">

<main class="container py-4">
  <div class="row">
    <div class="col-md-8 mx-auto">

          </div>

        </div>
        
        </div>
      </div>

          <textarea id="newCommentText" class="form-control mb-2 custom-textarea" placeholder="Dodaj komentarz" data-translate="addComment"></textarea>

</main>

<script src="static/javascripts/script.js"></script>
<script src="static/javascripts/rating.js"></script>
<script>
setupThemeToggle('toggleTheme');
// Konfiguracja
const urlParams = new URLSearchParams(window.location.search);
const testId = urlParams.get('testId');
let selectedDifficulty = 0;

console.log('Ładowanie testu ID:', testId);

let testData = null
let userAnswers = [];
let commentsMock = [];

async function loadTestFromDatabase() {
  const token = localStorage.getItem("token");

  try {
    const res = await fetch(`/api/tests/${testId}`, {
      headers: token ? {
        "Authorization": `Bearer ${token}`
      } : {}
    });

    if (!res.ok) {
      throw new Error("Nie udało się pobrać testu");
    }

    const raw = await res.json();

    // 🔁 Map backend → frontend structure (NO UI changes needed)
    testData = {
      _id: raw._id,
      title: raw.title,
      language: raw.language || "pl",
      user: raw.creatorId?.name || raw.creatorId?.email || "Użytkownik",
      rating: raw.rating || {},
      difficultyRating: raw.difficultiyRating || {},
      comments: raw.comments || [],
      questions: raw.questions.map(q => {
        // Zabezpieczenie: correct może być stringiem ("A") lub tablicą (["A", "C"])
        const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
        
        return {
            question: q.question,
            explanation: q.explanation || "", 
            answers: [
              // Sprawdzamy czy "A" jest w tablicy poprawnych odpowiedzi
              { text: q.answers[0] || q.answerA, isCorrect: correctArr.includes("A") },
              { text: q.answers[1] || q.answerB, isCorrect: correctArr.includes("B") },
              { text: q.answers[2] || q.answerC, isCorrect: correctArr.includes("C") },
              { text: q.answers[3] || q.answerD, isCorrect: correctArr.includes("D") }
            ].filter(a => a.text) // Filtrujemy puste, jeśli np. są tylko 2 odpowiedzi
        };
      })
    };

    commentsMock = testData.comments;

    displayTestLanguage();
    renderTest();
    initStarRating();
    initDifficultyStars();
    updateRatingDisplay();
    updateDifficultyDisplay();
    showUserDifficulty();

  } catch (err) {
    console.error(err);
    alert("Błąd ładowania testu");
  }
} 
function calculateAverageFromObject(obj){
  return obj.reduce((partialSum, a) => partialSum + a.rating, 0)/obj.length;
}
function updateDifficultyDisplay() {
  const el = document.getElementById('difficultyAverage');
  if (!el) return;
  console.log(testData.difficultyRating);
  const avg = calculateAverageFromObject(testData.difficultyRating);
  el.textContent = avg ? avg : "brak";

  if (!avg || avg === 0) {
    renderDifficultyStars(0);
    return;
  }

  renderDifficultyStars(avg);
}

function initDifficultyStars() {
  const stars = document.querySelectorAll('#difficultyStars span');

  stars.forEach(star => {
    star.addEventListener('mouseover', () => highlightDifficulty(star.dataset.diff));
    star.addEventListener('mouseout', () => highlightDifficulty(selectedDifficulty));
    star.addEventListener('click', () => {
      const token = localStorage.getItem('token');
      if (!token) return alert(t('loginToRate'));

      selectedDifficulty = parseInt(star.dataset.diff);
      highlightDifficulty(selectedDifficulty);
    });
  });
}

document.getElementById('submitDifficultyBtn').addEventListener('click', async () => {
  if (selectedDifficulty === 0) return alert(t('selectDifficulty'));

  try {
    const user = JSON.parse(localStorage.getItem('user'));
    const userId = user.id || user._id || user.email;

    const response = await fetch(`/api/tests/${testId}/difficulty-rating`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        // Optionally include auth token if your authMiddleware requires it
        'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
      },
      body: JSON.stringify({ rating: selectedDifficulty })
    });

    const data = await response.json();

    if (!response.ok) {
      return alert(data.message || 'Failed to submit rating.');
    }

    alert('Difficulty rating saved successfully!');
  try {
    const token = localStorage.getItem("token");
    const res = await fetch(`/api/tests/${testId}`, {
      headers: token ? {
        "Authorization": `Bearer ${token}`
      } : {}
    });

    if (!res.ok) {
      throw new Error("Nie udało się pobrać testu");
    }

    const raw = await res.json();

    // 🔁 Map backend → frontend structure (NO UI changes needed)
    testData = {
      _id: raw._id,
      title: raw.title,
      language: raw.language || "pl",
      user: raw.creatorId?.name || raw.creatorId?.email || "Użytkownik",
      rating: raw.rating || {},
      difficultyRating: raw.difficultiyRating || {},
      comments: raw.comments || [],
      questions: raw.questions.map(q => {
        // Zabezpieczenie: correct może być stringiem ("A") lub tablicą (["A", "C"])
        const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
        
        return {
            question: q.question,
            explanation: q.explanation || "", // <--- NOWE POLE
            answers: [
              // Sprawdzamy czy "A" jest w tablicy poprawnych odpowiedzi
              { text: q.answers[0] || q.answerA, isCorrect: correctArr.includes("A") },
              { text: q.answers[1] || q.answerB, isCorrect: correctArr.includes("B") },
              { text: q.answers[2] || q.answerC, isCorrect: correctArr.includes("C") },
              { text: q.answers[3] || q.answerD, isCorrect: correctArr.includes("D") }
            ].filter(a => a.text) // Filtrujemy puste, jeśli np. są tylko 2 odpowiedzi
        };
      })
    };

    commentsMock = testData.comments;
  } catch (err) {
    console.error(err);
    alert("Błąd ładowania testu");
  }
    updateDifficultyDisplay();
  } catch (err) {
    console.error(err);
    alert('An error occurred while submitting the difficulty rating.');
  }
});


window.onLanguageChange = function(lang) {
  console.log('Język zmieniony na:', lang);
  
  // Jeśli wyniki są wyświetlane, przetłumacz je
  const resultArea = document.getElementById('resultArea');
  if (resultArea && !resultArea.classList.contains('d-none')) {
    translateResults();
    renderTest();
    showUserDifficulty();
    updateRatingDisplay();
  }

  if (!document.getElementById('resultArea').classList.contains('d-none')) {
    showResults();   // <---- PRZETŁUMACZ WYNIKI
  }
  
  // Aktualizuj język testu
  displayTestLanguage();
};

// Zachowaj też istniejącą funkcję updateDynamicContent dla kompatybilności
window.updateDynamicContent = function(lang) {
  window.onLanguageChange(lang);
};



// Render pytań do rozwiązania - UŻYWAJĄC KLAS BOOTSTRAP JAK W TRYBIE TESTOWYM

function renderTest() {
  document.getElementById('testTitle').textContent = `${testData.title} – ${testData.user}`;
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  
  // Resetujemy odpowiedzi użytkownika na tablice (dla wielokrotnego wyboru)
  userAnswers = testData.questions.map(() => []); 

  testData.questions.forEach((q, idx) => {
    const questionCard = document.createElement('div');
    questionCard.className = 'card mb-4';
    
    // Dodajemy informację o wielokrotnym wyborze
    const correctCount = q.answers.filter(a => a.isCorrect).length;
    const hintText = correctCount > 1 
        ? `<div class="quiz-hint quiz-hint--multi">
                    <span class="quiz-hint-icon">✔✔</span>
                    <span class="quiz-hint-text" data-translate='multipleAnsInfo'>
                      ${t('multipleAnsInfo')}
                    </span>
                </div>` 
        : ``;

    const answersDiv = document.createElement('div');
    answersDiv.className = 'list-group list-group-flush';
    answersDiv.id = `answers-${idx}`;
    
    q.answers.forEach((a, answerIdx) => {
      const answerBtn = document.createElement('button');
      answerBtn.type = 'button';
      answerBtn.className = 'list-group-item list-group-item-action d-flex align-items-center gap-2';
      
      // Dodajemy checkbox wizualny (opcjonalnie, dla jasności)
      answerBtn.innerHTML = `
        <input type="checkbox" class="form-check-input me-2" style="pointer-events: none;">
        <span>${a.text}</span>
      `;

      answerBtn.onclick = () => {
        // 1. Toggle klasy wizualnej
        answerBtn.classList.toggle('active');
        
        // Zaznaczamy/odznaczamy checkbox w środku (dla efektu wizualnego)
        const checkbox = answerBtn.querySelector('input');
        checkbox.checked = answerBtn.classList.contains('active');

        // 2. Aktualizacja tablicy odpowiedzi użytkownika
        const currentAnswers = userAnswers[idx];
        
        if (answerBtn.classList.contains('active')) {
            // Dodaj indeks, jeśli go nie ma
            if (!currentAnswers.includes(answerIdx)) {
                currentAnswers.push(answerIdx);
            }
        } else {
            // Usuń indeks
            const i = currentAnswers.indexOf(answerIdx);
            if (i > -1) {
                currentAnswers.splice(i, 1);
            }
        }
      };
      answersDiv.appendChild(answerBtn);
    });
    
    questionCard.innerHTML = `
      <div class="card-body">
        <h5 class="card-title d-flex justify-content-between align-items-center">
          <div>
              <span data-translate="question">${t("question")}</span>
              <span class="questionCount"> ${idx+1}</span>
          </div>
          ${hintText}
        </h5>
        <p class="card-text fw-bold mt-2">${q.question}</p>
      </div>
    `;
    questionCard.querySelector('.card-body').appendChild(answersDiv);
    container.appendChild(questionCard);
  });
  
  document.getElementById('userFeedback').classList.add('d-none');
  document.getElementById('resultArea').classList.add('d-none');
}

// Sprawdzanie wyników
function checkResults() {
  let correct = 0;
  
  testData.questions.forEach((q, idx) => {
    const userIndices = userAnswers[idx] || [];
    const correctIndices = q.answers
        .map((a, i) => a.isCorrect ? i : -1)
        .filter(i => i !== -1);

    const userString = JSON.stringify(userIndices.sort());
    const correctString = JSON.stringify(correctIndices.sort());

    if (userString === correctString) {
      correct++;
    }
  });
  
  const total = testData.questions.length;
  // Zabezpieczenie przed dzieleniem przez zero
  const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
  
  console.log(`Wynik: ${correct} / ${total} (${percent}%)`);
  
  // Zwracamy obiekt z wynikami
  return {
    correct,
    total,
    percent
  };
}

// Funkcja pomocnicza do fetchowania 
async function saveTestResultAPI(data) {
    const token = localStorage.getItem("token");
    if(!token) return { pointsAdded: 0, alreadyPassed: false };

    const res = await fetch("/api/tests/save-result", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify(data)
    });
    
    if (!res.ok) throw new Error("Błąd sieci");
    return await res.json();
}

// Pokazanie wyników
async function showResults() {
    // 1. Obliczamy wynik (funkcja checkResults powinna być synchroniczna i zwracać obiekt)
    const result = checkResults(); 
    const container = document.getElementById('questionsContainer');

    if (!container) {
        console.error('Nie znaleziono kontenera pytań');
        return;
    }

    container.innerHTML = '';

    // --- RENDEROWANIE ODPOWIEDZI ---
    testData.questions.forEach((q, idx) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'card mb-4';

        // Odpowiedzi użytkownika
        const userIndices = userAnswers[idx] || []; 
        const userAnswerText = userIndices.length > 0
            ? userIndices.map(i => q.answers[i].text).join('<br>') 
            : t('noAnswer');

        // Poprawne odpowiedzi
        const correctIndices = q.answers
            .map((a, i) => a.isCorrect ? i : -1)
            .filter(i => i !== -1);

        const correctAnswerText = q.answers
            .filter(a => a.isCorrect)
            .map(a => a.text)
            .join('<br>');

        // Sprawdzanie poprawności
        const userString = JSON.stringify(userIndices.sort());
        const correctString = JSON.stringify(correctIndices.sort());
        const isCorrect = userString === correctString;

        // Wyjaśnienie
        let explanationHtml = '';
        if (q.explanation && q.explanation.trim() !== "") {
            explanationHtml = `
                <div class="mt-3 p-3 alert alert-warning">
                    <div class="d-flex align-items-start gap-2">
                        <span class="fs-5">💡</span>
                        <div>
                            <strong data-translate="explanationLabel">${t('explanationLabel') || 'Wyjaśnienie'}:</strong><br>
                            <span class="text-muted">${q.explanation}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        questionCard.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">
                <span data-translate="question">${t("question")}</span> ${idx + 1}
            </h5>
            <p class="card-text fw-bold">${q.question}</p>
            
            <div class="mt-3">
              <div class="mb-2">
                  <strong data-translate="yourAnswer">${t('yourAnswer') || 'Your answer'}:</strong>
                  <div class="p-2 border rounded ${isCorrect ? 'bg-success bg-opacity-10 border-success' : 'bg-danger bg-opacity-10 border-danger'}">
                    ${userAnswerText}
                  </div>
              </div>

            <p class="mb-2 ${isCorrect ? 'text-success' : 'text-danger'}">
              <strong>
                ${isCorrect ? '✅ ' : '❌ '}
                <span data-translate="${isCorrect ? 'correct' : 'incorrect'}">
                  ${isCorrect ? t('correct') : t('incorrect')}
                </span>
              </strong>
            </p>

              ${!isCorrect ? `
              <div class="mb-2">
                  <strong data-translate="correctAnswers">${t('correctAnswers')}:</strong>
                  <div class="p-2 border rounded bg-success bg-opacity-10 border-success">
                    ${correctAnswerText}
                  </div>
              </div>` : ''}
              
              ${explanationHtml}
            </div>
          </div>
        `;
        container.appendChild(questionCard);
    });

    // --- AKTUALIZACJA STATYSTYK ---
    const resultAreaElem = document.getElementById('resultArea');
    if (resultAreaElem) {
        const correctCountElem = document.getElementById('correctCount') || resultAreaElem.querySelector('#correctCount');
        const totalCountElem = document.getElementById('totalCount') || resultAreaElem.querySelector('#totalCount');
        const percentResultElem = document.getElementById('percentResult') || resultAreaElem.querySelector('#percentResult');

        if (correctCountElem && totalCountElem && percentResultElem) {
            correctCountElem.textContent = result.correct;
            totalCountElem.textContent = result.total;
            percentResultElem.textContent = `${result.percent}%`;
            resultAreaElem.classList.remove('d-none');
        }
    }

    // Pokaż sekcję komentarzy
    const userFeedbackElem = document.getElementById('userFeedback');
    if (userFeedbackElem) {
        userFeedbackElem.classList.remove('d-none');
        if(typeof renderComments === 'function') renderComments(testData.comments);
    }

    // Ukryj przycisk
    const checkResultsBtnElem = document.getElementById('checkResultsBtn');
    if (checkResultsBtnElem) {
        checkResultsBtnElem.classList.add('d-none');
    }

    // --- 2. LOGIKA PUNKTÓW (API) ---
    
    const feedbackArea = document.getElementById('resultArea');

    const resultData = {
      testId: testData._id,         
      testTitle: testData.title,    
      authorName: testData.user,    
      score: result.percent,        
      totalQuestions: result.total, 
      correctAnswers: result.correct 
    };

    try {
      const response = await saveTestResultAPI(resultData);
      const feedbackArea = document.getElementById('resultArea');

    // 1. Sukces z punktami
      if (response.pointsAdded > 0) {
          if (typeof updateUserPointsUI === 'function') updateUserPointsUI(response.pointsAdded);

          const paramsObj = { 
              title: testData.title, 
              points: response.pointsAdded 
          };
          
          const message = t('test_success_points', paramsObj);
          
          const paramsString = JSON.stringify(paramsObj).replace(/'/g, "&apos;");

          feedbackArea.innerHTML += `
              <div class="alert alert-success text-center mt-3" 
                  data-translate="test_success_points" 
                  data-params='${paramsString}'>
                  ${message}
              </div>`;

      // 2. Sukces bez punktów (już zaliczone)
      } else if (result.percent >= 50 && response.alreadyPassed) {
          const message = t('test_passed_again');

          feedbackArea.innerHTML += `
              <div class="alert alert-info text-center mt-3" 
                  data-translate="test_passed_again">
                  ${message}
              </div>`;

      // 3. Porażka
      } else if (result.percent < 50) {
          
          const paramsObj = { percent: result.percent };
          const message = t('test_failed_score', paramsObj);
          const paramsString = JSON.stringify(paramsObj);

          feedbackArea.innerHTML += `
              <div class="alert alert-secondary text-center mt-3" 
                  data-translate="test_failed_score"
                  data-params='${paramsString}'>
                  ${message}
              </div>`;
      }

  } catch (err) {
      console.error("Błąd zapisu:", err);
  }
}

function createFallbackResults(result) {
  const container = document.getElementById('questionsContainer');
  if (!container) return;
  
  const resultsCard = document.createElement('div');
  resultsCard.className = 'card mb-4';
  resultsCard.innerHTML = `
    <div class="card-body">
      <h4 class="card-title">🎓 ${t('results')}</h4>
      <p class="card-text">${t('correctAnswers')}: <strong>${result.correct}</strong> / <strong>${result.total}</strong></p>
      <p class="card-text">${t('percentResult')}: <strong>${result.percent}%</strong></p>
    </div>
  `;
  
  // Wstaw na początek kontenera
  container.insertBefore(resultsCard, container.firstChild);
}

// Obsługa przycisku sprawdzania wyniku
document.getElementById('checkResultsBtn').addEventListener('click', () => {
  // Sprawdź czy wszystkie pytania mają odpowiedzi
  const allAnswered = testData.questions.every((q, idx) => {
    return userAnswers[idx] !== undefined;
  });
  
  if (!allAnswered) {
    if (!confirm(t('notAllAnswered'))) {
      return userAnswers[idx] !== undefined;
    }
  }
  
  showResults();
});

// Ocena na gwiazdki
let selectedRating = 0;

function initStarRating() {
  const stars = document.querySelectorAll('#ratingStars span');

  stars.forEach(star => {
    star.addEventListener('mouseover', () => {
      const val = star.dataset.star;
      highlightStars(val);
    });

    star.addEventListener('mouseout', () => {
      highlightStars(selectedRating);
    });

    star.addEventListener('click', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        alert(t('loginToRate'));
        return;
      }
      selectedRating = parseInt(star.dataset.star);
      highlightStars(selectedRating);
    });
  });
}



function renderDifficultyStars(avg) {
  const el = document.getElementById('difficultyStarsAverage');
  const textEl = document.getElementById('difficultyAverageText');
  if (!el || !textEl) return;

  // Ograniczenie: trudność 1–3, średnia np. 2.3
  const rounded = Math.round(avg);
  let starsHTML = '';

  // Pełne gwiazdy (max 3)
  for (let i = 0; i < rounded; i++) {
    starsHTML += '<span class="star-filled">★</span>';
  }

  // Puste do 3
  for (let i = rounded; i < 3; i++) {
    starsHTML += '<span class="star-empty">☆</span>';
  }

  el.innerHTML = starsHTML;
  textEl.textContent = `${avg}`;
}


// Komentarze
function renderComments(comments, container=document.getElementById('commentsContainer')) {
  container.innerHTML='';
  console.log(comments);
  comments.forEach(c=>{
    const div=document.createElement('div');
    div.classList.add('border','p-3','mb-3','rounded');
    div.dataset.id = c._id;
    div.dataset.userId = c.userId

// Funkcje pomocnicze do znajdowania i usuwania komentarzy
function findCommentById(id, list) {
  for (const c of list) {
    if (c._id === id) return c;
    const child = findCommentById(id, c.replies);
    if (child) return child;
  }
  return null;
}

function deleteCommentById(id, list) {
  const index = list.findIndex(c => c._id === id);
  if (index !== -1) return list.splice(index, 1);

  for (const c of list) {
    deleteCommentById(id, c.replies);
  }
}

function updateRatingDisplay() {
  // 1. Obliczamy średnie
  const avgRating = calculateAverageFromObject(testData.rating);
  const avgDifficulty = calculateAverageFromObject(testData.difficultyRating);
  
  const ratingCount = testData.rating ? testData.rating.length : 0;

  // 2. Pobieramy elementy DOM
  const averageStars = document.getElementById('averageStars');
  const avgDifficultyStars = document.getElementById('avgDifficultyStars');
  const averageText = document.getElementById('averageText');
  const ratingsCount = document.getElementById('ratingsCount');

  // --- FUNKCJA POMOCNICZA DO GENEROWANIA HTML GWIAZDEK ---
  const generateStars = (value, maxStars) => {
    const fullStarsCount = Math.round(value || 0);
    const emptyStarsCount = Math.max(0, maxStars - fullStarsCount);
    
    let starsHTML = '';
    
    // Pełne gwiazdki
    for (let i = 0; i < fullStarsCount; i++) {
      starsHTML += '<span class="star-filled">★</span>';
    }
    
    // Puste gwiazdki
    for (let i = 0; i < emptyStarsCount; i++) {
      starsHTML += '<span class="star-empty">☆</span>';
    }
    
    return starsHTML;
  };

  // 3. Renderowanie Głównej Oceny (Skala 5)
  if (averageStars) {
    averageStars.innerHTML = generateStars(avgRating, 5);

    // Obsługa tekstu obok gwiazdek (np. "4.5 (12)")
    if (averageText && ratingsCount) {
      if (ratingCount > 0 && avgRating > 0) {
        averageText.textContent = `${avgRating}`;
        ratingsCount.textContent = ` (${ratingCount})`;
      } else {
        averageText.textContent = t('noRatings'); // "Brak ocen"
        ratingsCount.textContent = '';
      }
    }
  }

  // 4. Renderowanie Poziomu Trudności (Skala 3)
  if (avgDifficultyStars) {
    avgDifficultyStars.innerHTML = generateStars(avgDifficulty, 3);
  }
}
