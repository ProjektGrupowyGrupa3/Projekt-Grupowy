async function loadAndRenderSubjects(lang) {
    const select = document.getElementById('subject');
    const selectedLang = lang || 'pl';
    
    if (!select) return;

    select.innerHTML = '<option disabled selected>Wczytywanie...</option>';

    try {
        const res = await fetch(`/api/subjects?lang=${selectedLang}`);
        if (!res.ok) throw new Error(`Błąd HTTP: ${res.status}`);
        
        const subjects = await res.json();
        select.innerHTML = '';

        if (!subjects || subjects.length === 0) {
            select.innerHTML = '<option value="">Brak przedmiotów w bazie</option>';
            return;
        }

        subjects.forEach(subj => {
            const option = document.createElement('option');
            option.value = subj._id;
            option.textContent = `${subj.name} (sem. ${subj.semester})`;
            select.appendChild(option);
        });

    } catch (err) {
        console.error('Błąd podczas pobierania przedmiotów:', err);
        select.innerHTML = '<option value="">Błąd połączenia z bazą</option>';
    }
}

async function loadQuestions(subjectId, mode = 'all') {
    try {
        const lang = localStorage.getItem('language') || 'pl';
        const res = await fetch(`/api/questions?subject=${encodeURIComponent(subjectId)}&mode=${mode}&lang=${lang}`, {
            headers: getAuthHeaders()
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { totalCount, questions } = await res.json();
        totalQuestions = totalCount; // Zapisujemy całkowitą liczbę pytań na start
        return questions;
    } catch (e) {
        console.error('Błąd pobierania pytań:', e);
        return [];
    }
}

async function saveAnswerToDB(questionId, isCorrect) {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        await fetch('/api/user-progress/save', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ questionId, correct: isCorrect })
        });
    } catch (err) {
        console.error('❌ Błąd zapisu odpowiedzi:', err);
    }
}

function createShowCorrectButton(q) {
    const t = getGlobalT();
    const showBtn = document.createElement('button');
    showBtn.className = 'btn btn-outline-success mt-2';
    showBtn.textContent = t.quiz_btn_show_answer || "Pokaż poprawną odpowiedź";
    // showBtn.textContent = '👀 Pokaż poprawną odpowiedź';
    showBtn.setAttribute('data-translate', 'quiz_btn_show_answer');
    showBtn.onclick = () => {
        const correctAns = q.answers.find(a => a.isCorrect);
        if (!correctAns) return;
        Array.from(opts.children).forEach(b => {
            if (b.textContent === correctAns.text) b.classList.add('list-group-item-success');
        });

        const infoDiv = document.createElement('div');
        infoDiv.className = 'alert alert-info mt-2';
        const headerText = t.quiz_header_correct || "Poprawna odpowiedź:";
        infoDiv.innerHTML = `
            <strong><span data-translate="quiz_header_correct">${headerText}</span></strong> ${correctAns.text}<br>
            <em>${correctAns.explanation}</em>
        `;

        explain.appendChild(infoDiv);

        showBtn.disabled = true;
    };
    return showBtn;
}
