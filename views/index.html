<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnIt — Strona główna</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="static/stylesheets/style.css">
</head>
<body>


<main class="container py-5">
  <div class="row">
    <div class="col-md-8 mx-auto text-center">
      <h1 class="display-5" data-translate="welcome">Witamy w LearnIt</h1>
      <p class="lead" data-translate="description">Szkielet strony do nauki — responsywny, z logowaniem i dwoma trybami quizów.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="/quiz/test" class="btn btn-primary btn-lg" data-translate="testMode">Rozpocznij test</a>
        <a href="/quiz/learn" class="btn btn-secondary btn-lg" data-translate="learnMode">Tryb nauki</a>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="pointsToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body fs-6">
        <span class="me-2">🎉</span>
        Zdobyłeś <strong id="toastPointsValue">0</strong> pkt!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
</main>
<script src="static/javascripts/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/javascripts/translations.js"></script>
</body>
</html>
