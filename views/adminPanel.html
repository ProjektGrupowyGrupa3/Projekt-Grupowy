<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="title">Panel Administratora — LearnIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/stylesheets/style.css">
    <link rel="stylesheet" href="/static/stylesheets/adminPanel.css">
</head>

<body>
    <main class="container py-4">
        <h2 class="mb-4" data-translate="title">Panel Administratora</h2>

        <!-- Zakładki -->
        <ul class="nav nav-tabs admin-tabs" id="adminTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="reports" data-translate="repots">Zgłoszenia</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="users"  data-translate="users">Użytkownicy</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="questions" data-translate="questions">Pytania</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="subjects" data-translate="subjects">Przedmioty</button></li>
        </ul>

        <!-- Sekcje -->
        <div id="tabContent" class="mt-4">

            <!-- Zgłoszenia -->
            <div class="admin-tab" id="tab-reports">
                <h4 data-translate="commentsRepots">Zgłoszenia komentarzy</h4>
                <div id="reportsContainer"></div>
            </div>

            <!-- Użytkownicy -->
            <div class="admin-tab d-none" id="tab-users">
                <h4 data-translate="userManagment">Zarządzanie użytkownikami</h4>
                <div class="mb-3">
                    <input type="text" id="userSearch" class="form-control"
                        placeholder="Szukaj użytkowników po nazwie lub emailu">
                </div>
                <div id="usersContainer"></div>
            </div>

            <!-- Pytania -->
            <div class="admin-tab d-none" id="tab-questions">
                <h4 data-translate="questionsManagment">Zarządzanie pytaniami</h4>
                <div class="mb-3">
                    <input type="text" id="questionSearch" class="form-control" placeholder="Szukaj pytań lub tagów">
                </div>
                <button id="addQuestionBtn" class="btn btn-primary mb-3" data-translate="addQuestion">Dodaj pytanie</button>
                <div id="questionsContainer"></div>
            </div>

            <!-- Przedmioty -->
            <div class="admin-tab d-none" id="tab-subjects">
                <h4 data-translate="subjectsManagment">Zarządzanie przedmiotami</h4>
                <div class="mb-3">
                    <input type="text" id="subjectSearch" class="form-control" placeholder="Szukaj przedmiotów">
                </div>
                <button id="addSubjectBtn" class="btn btn-primary mb-3" data-translate="addSubject">Dodaj przedmiot</button>
                <div id="subjectsContainer"></div>
            </div>

        </div>

        <div class="modal fade" id="addQuestionModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" data-translate="addQuestion">Dodaj pytanie</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="addQuestionForm">
                           
                            <div class="mb-2">
                                <label data-translate="subject">Przedmiot</label>
                                <select class="form-select" name="subject" required>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label data-translate="questionPL">Pytanie (PL)</label>
                                <textarea class="form-control" name="question_pl" required></textarea>
                            </div>

                            <div class="mb-2">
                                <label data-translate="questionEN">Pytanie (EN)</label>
                                <textarea class="form-control" name="question_en" required></textarea>
                            </div>
                            <div id="answersContainer"></div>

                            <div class="d-flex gap-2 mt-2">
                            <button type="button" id="addAnswerBtn" class="btn btn-secondary btn-sm" data-translate="addAnswer">
                                + Dodaj odpowiedź
                            </button>
                            </div>
                            
                            <div class="mb-2">
                                <label data-translate="difficulty">Trudność [easy,medium,hard]</label>
                                <select class="form-control" name="difficulty" value="easy" required>
                                        <option value="easy">easy</option>
                                        <option value="medium">medium</option>
                                        <option value="hard">hard</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label data-translate="tags">Tagi (oddzielone przecinkami)</label>
                                <input class="form-control" name="tags" placeholder="Monolit, Systemy operacyjne">
                            </div>
                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" data-translate="cancel">Anuluj</button>
                        <button class="btn btn-primary" id="saveQuestionBtn" data-translate="save">Zapisz</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="modal fade" id="editQuestionModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" data-translate="editQuestion">Edytuj pytanie</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="editQuestionForm">
                            <input type="hidden" name="id">
                            <div class="mb-2">
                                <label data-translate="questionNumber">Numer pytania</label>
                                <input type="number" class="form-control" name="number" required>
                            </div>

                            <div class="mb-2">
                                <label data-translate="subject">Przedmiot</label>
                                <select class="form-select" name="subject" required>
                                    <!-- wypełniane JS-em -->
                                </select>
                            </div>
                            <div class="mb-2">
                                <label data-translate="questionPL">Pytanie (PL)</label>
                                <textarea class="form-control" name="question_pl" required></textarea>
                            </div>

                            <div class="mb-2">
                                <label data-translate="questionEN">Pytanie (EN)</label>
                                <textarea class="form-control" name="question_en" required></textarea>
                            </div>

                            <div class="mb-2">
                                <label data-translate="difficulty">Trudność</label>
                                <input class="form-control" name="difficulty" placeholder="(easy, medium, hard)"
                                    required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="tags">Tagi (oddzielone przecinkami)</label>
                                <input class="form-control" name="tags" placeholder="Monolit, Systemy operacyjne">
                            </div>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" data-translate="cancel">Anuluj</button>
                        <button class="btn btn-primary" id="updateQuestionBtn" data-translate="saveChanges">Zapisz zmiany</button>
                    </div>

                </div>
            </div>
        </div>


        <div class="modal fade" id="addSubjectModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" data-translate="addSubject">Dodaj przedmiot</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="addSubjectForm">
                            <div class="mb-2">
                                <label data-translate="namePL">Nazwa (PL)</label>
                                <input class="form-control" name="name_pl" required>
                            </div>

                            <div class="mb-2">
                                <label data-translate="nameEN">Nazwa (EN)</label>
                                <input class="form-control" name="name_en" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="semester">Semestr</label>
                                <input type="number" class="form-control" name="semester" min="1" max="7" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="descriptionPL">Opis (PL)</label>
                                <input class="form-control" name="description_pl" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="descriptionEN">Opis (EN)</label>
                                <input class="form-control" name="description_en" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="specializationPL">Specjalizacja (PL)</label>
                                <input class="form-control" name="specialization_pl" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="specializationEN">Specjalizacja (EN)</label>
                                <input class="form-control" name="specialization_en" required>
                            </div>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
                        <button class="btn btn-primary" id="saveSubjectBtn">Zapisz</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="modal fade" id="editSubjectModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" data-translate="editSubject">Edytuj przedmiot</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="editSubjectForm">
                            <div class="mb-2">
                                <label data-translate="namePL">Nazwa (PL)</label>
                                <input class="form-control" name="name_pl" required>
                            </div>

                            <div class="mb-2">
                                <label data-translate="nameEN">Nazwa (EN)</label>
                                <input class="form-control" name="name_en" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="semester">Semestr</label>
                                <input type="number" class="form-control" name="semester" min="1" max="7" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="descriptionPL">Opis (PL)</label>
                                <input class="form-control" name="description_pl" required>
                            </div>

                            <div class="mb-2">
                                <label data-translate="descriptionEN">Opis (EN)</label>
                                <input class="form-control" name="description_en" required>
                            </div>
                            <div class="mb-2">
                                <label data-translate="specializationPL">Specjalizacja (PL)</label>
                                <input class="form-control" name="specialization_pl" required>
                            </div>
                            <div class="mb-2">
                                <label  data-translate="specializationEN">Specjalizacja (EN)</label>
                                <input class="form-control" name="specialization_en" required>
                            </div>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" data-translate="cancel">Anuluj</button>
                        <button class="btn btn-primary" id="updateSubjectBtn" data-translate="save">Zapisz</button>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-translate="repotsDetails">Szczegóły zgłoszenia</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="reportDetails"></div>

                    <textarea id="adminReason" class="form-control mt-3"
                        placeholder="Powód decyzji (opcjonalnie)"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" id="dismissReportBtn" data-translate="dismissReport">
                        Odrzuć zgłoszenie
                    </button>
                    <button class="btn btn-warning" id="deleteReportBtn" data-translate="deleteContent">
                        Usuń treść
                    </button>
                    <button class="btn btn-danger" id="banReportBtn" data-translate="banUser">
                        Zbanuj użytkownika
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-tab]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.admin-tab').forEach(tab => tab.classList.add('d-none'));
                document.getElementById('tab-' + btn.dataset.tab).classList.remove('d-none');
            });
        });

        function getToken() {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; token=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }

        const questionsContainer = document.getElementById('questionsContainer');
        const questionSearchInput = document.getElementById('questionSearch');
        let questionTimeout;

        async function fetchQuestions(query = "") {
            try {
                const res = await fetch(`/api/adminPanel/questions/search?q=${encodeURIComponent(query)}`, {
                    headers: { "Authorization": `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error("Failed to fetch questions");
                const questions = await res.json();
                renderQuestions(questions);
            } catch (err) {
                console.error(err);
                questionsContainer.innerHTML = `<div class="text-danger">Błąd ładowania pytań</div>`;
            }
        }

        function renderQuestions(questions) {
            questionsContainer.innerHTML = "";
            if (!questions.length) {
                questionsContainer.innerHTML = `<div>Brak wyników</div>`;
                return;
            }

            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = "card mb-2";
                div.innerHTML = `
            <div class="card-body">
                <strong>Numer:</strong> ${q.number || "-"}<br>
                <strong>Przedmiot(PL):</strong> ${q.subject?.name?.pl || "-"}<br>
                <strong>Przedmiot(EN):</strong> ${q.subject?.name?.en || "-"}<br>
                <strong>Pytanie (PL):</strong> ${q.question?.pl}<br>
                <strong>Pytanie (EN):</strong> ${q.question?.en}<br>
                <strong>Trudność:</strong> ${q.difficulty}<br>
                <strong>Tagi:</strong> ${q.tags?.join(", ") || "-"}<br>
                <div class="mt-2">
                    <button class="btn btn-primary btn-sm me-2 editQuestionBtn">Edytuj</button>
                    <button class="btn btn-danger btn-sm deleteQuestionBtn">Usuń</button>
                </div>
            </div>
        `;
                questionsContainer.appendChild(div);

                const deleteBtn = div.querySelector('.deleteQuestionBtn');
                deleteBtn.addEventListener('click', async () => {
                    if (!confirm(`Czy na pewno chcesz usunąć pytanie: "${q.question?.pl}"?`)) return;

                    try {
                        const res = await fetch(`/api/adminPanel/questions/${q._id}`, {
                            method: 'DELETE',
                            headers: { "Authorization": `Bearer ${getToken()}` }
                        });
                        if (!res.ok) throw new Error("Nie udało się usunąć pytania");
                        alert("Pytanie zostało usunięte");
                        fetchQuestions(questionSearchInput.value.trim());
                    } catch (err) {
                        console.error(err);
                        alert("Błąd podczas usuwania pytania. Spróbuj ponownie.");
                    }
                });
                const editBtn = div.querySelector('.editQuestionBtn');
                editBtn.addEventListener('click', async () => {
                    const form = document.getElementById('editQuestionForm');
                    const select = form.querySelector('select[name="subject"]');

                    form.dataset.id = q._id;
                    form.elements['number'].value = q.number;
                    form.elements['question_pl'].value = q.question.pl;
                    form.elements['question_en'].value = q.question.en;
                    form.elements['difficulty'].value = q.difficulty;
                    form.elements['tags'].value = q.tags?.join(', ') || '';

                    await loadSubjectsToSelect(select, q.subject?._id);

                    editModalQ.show();
                });

            });
        }

        questionSearchInput.addEventListener('input', () => {
            clearTimeout(questionTimeout);
            questionTimeout = setTimeout(() => {
                fetchQuestions(questionSearchInput.value.trim());
            }, 300);
        });

        fetchQuestions();


        const subjectsContainer = document.getElementById('subjectsContainer');
        const subjectSearchInput = document.getElementById('subjectSearch');
        let subjectTimeout;

        async function fetchSubjects(query = "") {
            try {
                const res = await fetch(`/api/adminPanel/subjects/search?q=${encodeURIComponent(query)}`, {
                    headers: { "Authorization": `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error("Failed to fetch subjects");
                const subjects = await res.json();
                renderSubjects(subjects);
            } catch (err) {
                console.error(err);
                subjectsContainer.innerHTML = `<div class="text-danger">Błąd ładowania przedmiotów</div>`;
            }
        }

        function renderSubjects(subjects) {
            subjectsContainer.innerHTML = "";
            if (!subjects.length) {
                subjectsContainer.innerHTML = `<div>Brak wyników</div>`;
                return;
            }

            subjects.forEach(s => {
                const div = document.createElement('div');
                div.className = "card mb-2";
                div.innerHTML = `
            <div class="card-body">
                <strong>Nazwa (PL):</strong> ${s.name?.pl || "-"}<br>
                <strong>Nazwa (EN):</strong> ${s.name?.en || "-"}<br>
                <strong>Opis(PL):</strong> ${s.description?.pl || "-"}<br>
                <strong>Opis(EN):</strong> ${s.description?.en || "-"}<br>
                <strong>Specjalizacja(PL):</strong> ${s.specialization?.pl || "-"}<br>
                <strong>Specjalizacja(EN):</strong> ${s.specialization?.en || "-"}<br>
                <div class="mt-2">
                    <button class="btn btn-primary btn-sm me-2 editSubjectBtn">Edytuj</button>
                    <button class="btn btn-danger btn-sm deleteSubjectBtn">Usuń</button>
                </div>
            </div>
        `;
                subjectsContainer.appendChild(div);

                const deleteBtn = div.querySelector('.deleteSubjectBtn');
                deleteBtn.addEventListener('click', async () => {
                    if (!confirm(`Czy na pewno chcesz usunąć przedmiot: "${s.name?.pl}"?`)) return;

                    try {
                        const res = await fetch(`/api/adminPanel/subjects/${s._id}`, {
                            method: 'DELETE',
                            headers: { "Authorization": `Bearer ${getToken()}` }
                        });
                        if (!res.ok) throw new Error("Nie udało się usunąć przedmiotu");
                        alert("Przedmiot został usunięty");
                        fetchSubjects(subjectSearchInput.value.trim());
                    } catch (err) {
                        console.error(err);
                        alert("Błąd podczas usuwania przedmiotu. Spróbuj ponownie.");
                    }
                });

                const editBtn = div.querySelector('.editSubjectBtn');
                editBtn.addEventListener('click', () => {
                    const form = document.getElementById('editSubjectForm');
                    
                    form.dataset.id = s._id;
                    form.elements['name_pl'].value = s.name?.pl || '';
                    form.elements['name_en'].value = s.name?.en || '';
                    form.elements['description_pl'].value = s.description?.pl || '';
                    form.elements['description_en'].value = s.description?.en || '';
                    form.elements['specialization_pl'].value = s.specialization?.pl || '';
                    form.elements['specialization_en'].value = s.specialization?.en || '';


                    editModalS.show();
                });
            });
        }

        subjectSearchInput.addEventListener('input', () => {
            clearTimeout(subjectTimeout);
            subjectTimeout = setTimeout(() => {
                fetchSubjects(subjectSearchInput.value.trim());
            }, 300);
        });

        fetchSubjects();

        const usersContainer = document.getElementById('usersContainer');
        const userSearchInput = document.getElementById('userSearch');
        let searchTimeout;

        async function fetchUsers(query = "") {
            try {
                const res = await fetch(`/api/adminPanel/users?q=${encodeURIComponent(query)}`, {
                    headers: { "Authorization": `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error("Failed to fetch users");
                const users = await res.json();
                renderUsers(users);
            } catch (err) {
                console.error(err);
                usersContainer.innerHTML = `<div class="text-danger">Błąd ładowania użytkowników</div>`;
            }
        }

        function renderUsers(users) {
            usersContainer.innerHTML = "";
            if (!users.length) {
                usersContainer.innerHTML = `<div>Brak wyników</div>`;
                return;
            }
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = "card mb-2";
                div.innerHTML = `
        <div class="card-body d-flex justify-content-between align-items-center">
            <span class="fw-bold">Nazwa Użytkownika:</span> <span>${u.name}</span> 
            <span class="fw-bold ms-3">Adres Email:</span> <span>${u.email}</span>
            <div>
            <select class="form-select form-select-sm roleSelect" data-id="${u._id}">
                <option value="-1" ${u.accessLvl == -1 ? "selected" : ""}>Zablokowany</option>
                <option value="0" ${u.accessLvl == 0 ? "selected" : ""}>Użytkownik</option>
                <option value="1" ${u.accessLvl == 1 ? "selected" : ""}>Moderator</option>
                <option value="2" ${u.accessLvl == 2 ? "selected" : ""}>Administrator</option>
            </select>
            <button class="btn btn-warning btn-sm mt-2 blockBtn" data-id="${u._id}">
                ${u.accessLvl === -1 ? "Odblokuj" : "Zablokuj"}
            </button>
            <button class="btn btn-danger btn-sm mt-2 deleteUserBtn" data-id="${u._id}">Usuń</button>
            </div>
        </div>
        `;
                usersContainer.appendChild(div);

                const select = div.querySelector('.roleSelect');
                select.addEventListener('change', async () => {
                    const oldRole = getRoleName(u.accessLvl);
                    const newRole = getRoleName(parseInt(select.value));
                    if (!confirm(`Czy na pewno chcesz zmienić rolę użytkownika ${u.name} z "${oldRole}" na "${newRole}"?`)) {
                        select.value = u.accessLvl;
                        return;
                    }
                    try {
                        const res = await fetch(`/api/adminPanel/users/${u._id}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${getToken()}` },
                            body: JSON.stringify({ accessLvl: parseInt(select.value) })
                        });
                        if (!res.ok) throw new Error("Nie udało się zmienić roli");
                        u.accessLvl = parseInt(select.value);
                        alert(`Rola użytkownika ${u.name} została zmieniona na "${newRole}"`);
                    } catch (err) {
                        console.error(err);
                        alert("Błąd podczas zmiany roli. Spróbuj ponownie.");
                        select.value = u.accessLvl;
                    }
                });
            });
        }

        function getRoleName(accessLvl) {
            switch (parseInt(accessLvl)) {
                case -1: return "Zablokowany";
                case 0: return "Użytkownik";
                case 1: return "Moderator";
                case 2: return "Administrator";
                default: return "Nieznany";
            }
        }

        userSearchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchUsers(userSearchInput.value.trim());
            }, 300);
        });

        fetchUsers();
        loadUserReports()
        async function loadUserReports() {
            const container = document.getElementById('reportsContainer');
            container.innerHTML = '';

            const res = await fetch('/api/reports', {
                headers: {
                    Authorization: `Bearer ${localStorage.getItem('token')}`
                }
            });

            const reports = await res.json();

            // Active first
            reports.sort((a, b) => a.status === 'active' ? -1 : 1);

            reports.forEach(report => {
                const div = document.createElement('div');
                div.className = `list-group-item list-group-item-action ${report.status === 'active' ? 'fw-bold' : 'opacity-75'}`;

                div.innerHTML = `
      <div class="d-flex justify-content-between">
        <span>
          [${report.type.toUpperCase()}] 
          ${report.reportedUser.name}
        </span>
        <small>${new Date(report.createdAt).toLocaleString()}</small>
      </div>
    `;

                div.addEventListener('click', () => openReportDialog(report));
                container.appendChild(div);
            });
        }

        let currentReport = null;
        function openReportDialog(report) {
            currentReport = report;
            const details = document.getElementById('reportDetails');

            let html = `
    <p><strong>Zgłaszający:</strong> ${report.reporter.name}</p>
    <p><strong>Zgłoszony:</strong> ${report.reportedUser.name}</p>

        async function loadSubjectsToSelect(selectEl, selectedId = null) {

                    headers: { Authorization: `Bearer ${getToken()}` }
                });

                if (!res.ok) throw new Error('Nie udało się pobrać przedmiotów');

                const subjects = await res.json();

                selectEl.innerHTML = '<option value="">-- wybierz przedmiot --</option>';

                subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s._id;
                    opt.textContent = `${s.name.pl} (${s.name.en})`;
                    selectEl.appendChild(opt);
                });

                if (selectedId) {
                    selectEl.value = selectedId;
                }

            } catch (err) {
                console.error(err);

const MAX_ANSWERS = 5;
const MIN_ANSWERS = 2;

function createAnswerElement(index) {
  const div = document.createElement('div');
  div.className = 'answer border rounded p-2 mb-2';

  div.innerHTML = `
    <div class="row align-items-end">
      <div class="col-md-1 text-center">
        <input type="checkbox" class="form-check-input ans-correct">
        <small>OK</small>
      </div>
      <div class="col-md-5">
        <label>Odpowiedź (PL)</label>
        <input class="form-control ans-pl" required>
      </div>
      <div class="col-md-5">
        <label>Answer (EN)</label>
        <input class="form-control ans-en" required>
      </div>
      <div class="col-md-1 text-end">
        <button type="button" class="btn btn-sm btn-danger removeAnswerBtn">
          ✕
        </button>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-md-6">
        <input class="form-control ans-expl-pl" placeholder="Wyjaśnienie PL">
      </div>
      <div class="col-md-6">
        <input class="form-control ans-expl-en" placeholder="Explanation EN">
      </div>
    </div>
  `;

  return div;
}

    document.getElementById('addAnswerBtn').addEventListener('click', () => {
        const container = document.getElementById('answersContainer');

        if (container.children.length >= MAX_ANSWERS) {
            alert('Maksymalnie 5 odpowiedzi');
            return;
        }

        const el = createAnswerElement(container.children.length);
        container.appendChild(el);

        el.querySelector('.removeAnswerBtn').addEventListener('click', () => {
            if (container.children.length <= MIN_ANSWERS) {
                alert('Muszą być co najmniej 2 odpowiedzi');
                return;
            }
            el.remove();
        });
    });

    document.getElementById('saveQuestionBtn').addEventListener('click', async () => {
  const form = document.getElementById('addQuestionForm');
  const answers = [];

  document.querySelectorAll('#answersContainer .answer').forEach((box, i) => {
    answers.push({
      label: String.fromCharCode(97 + i),
      text: {
        pl: box.querySelector('.ans-pl').value,
        en: box.querySelector('.ans-en').value
      },
      explanation: {
        pl: box.querySelector('.ans-expl-pl').value,
        en: box.querySelector('.ans-expl-en').value
      },
      isCorrect: box.querySelector('.ans-correct').checked
    });
  });

  if (answers.length < 2) {
    alert('Minimum 2 odpowiedzi');
    return;
  }

  if (!answers.some(a => a.isCorrect)) {
    alert('Zaznacz przynajmniej jedną poprawną odpowiedź');
    return;
  }

  const payload = {
    subject: form.elements.subject.value,
    question: {
      pl: form.elements.question_pl.value,
      en: form.elements.question_en.value
    },
    difficulty: Number(form.elements.difficulty.value),
    tags: form.elements.tags.value
      .split(',')
      .map(t => t.trim())
      .filter(Boolean),
    answers
  };

  console.log('PAYLOAD 👉', payload); // DEBUG

  try {
    const res = await fetch('/api/adminPanel/questions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${getToken()}`
      },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    if (!res.ok) throw new Error(text);

    alert('Pytanie dodane 🧠🔥');
    questionModal.hide();
    fetchQuestions();

  } catch (err) {
    console.error('BACKEND SAYS:', err.message);
    alert('Błąd zapisu pytania:\n' + err.message);
  }
});



document.getElementById('addQuestionBtn').addEventListener('click', async () => {
  const form = document.getElementById('addQuestionForm');
  form.reset();

  const container = document.getElementById('answersContainer');
  container.innerHTML = '';

  container.appendChild(createAnswerElement(0));
  container.appendChild(createAnswerElement(1));

  container.querySelectorAll('.removeAnswerBtn').forEach(btn => {
    btn.addEventListener('click', e => {
      if (container.children.length <= MIN_ANSWERS) {
        alert('Min. 2 odpowiedzi');
        return;
      }
      e.target.closest('.answer').remove();
    });
  });

  await loadSubjectsToSelect(
    document.querySelector('#addQuestionForm select[name="subject"]')
  );

  questionModal.show();
});
