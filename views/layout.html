<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">LearnIt</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" id="adminPanel"><a class="nav-link" href="/adminPanel">Panel Administracyjny</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz/test">Test</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz/learn" data-translate="learnMode">Tryb nauki</a></li>
        <li class="nav-item"><a class="nav-link" href="/flashcards" data-translate="flashcards">Fiszki</a></li>
        <li class="nav-item"><a class="nav-link" href="/rank" data-translate="rank">Ranking</a></li>
        <li class="nav-item"><a class="nav-link" href="/create-test" data-translate="createTest">Utwórz test</a></li>
        <li class="nav-item"><a class="nav-link" href="/user-test-list" data-translate="userTestsList">Lista Testów użytkowników</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">

        <div id="user-nav" class="d-flex align-items-center gap-3" style="display: none !important;">
          <span id="userPointsBadge" class="badge bg-warning text-dark rounded-pill d-flex align-items-center">
              ⭐ <span id="userPointsValue" class="ms-1">0</span>
          </span>
        
          <div class="dropdown">
              <button class="btn dropdown-toggle d-flex align-items-center" type="button" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-person-circle me-2"></i>
                  <span id="userEmail">User</span>
              </button>
              <ul id="dropdown-menu" class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuBtn">
                  <li>
                      <a class="dropdown-item" href="/dashboard" data-translate="statistics">
                          <i class="bi bi-bar-chart-fill me-2"></i>Statystyki
                      </a>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                      <a class="dropdown-item text-danger" href="#" id="logoutLink" data-translate="logout">
                          <i class="bi bi-box-arrow-right me-2"></i>Wyloguj
                      </a>
                  </li>
              </ul>
          </div>
      </div>

      <div id="guest-nav" class="d-flex align-items-center" style="display: none !important;">
          <a id="authBtn" class="btn btn-outline-light me-2" href="/login" data-translate="login">Zaloguj</a>
          <a id="regBtn" class="btn btn-secondary" href="/register" data-translate="register">Rejestracja</a>
      </div>

      <button id="themeToggleBtn" class="btn btn-theme-toggle ms-2" aria-label="Zmień motyw">
          <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
      </button>

  </div>
    <div class="dropdown lang-dropdown-container">
        <button class="btn btn-link text-decoration-none dropdown-toggle text-light border-0" 
                type="button" 
                id="langDropdown" 
                aria-expanded="false"> <span id="currentLangLabel">PL</span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
            <li>
                <a class="dropdown-item lang-select d-flex justify-content-between text-light align-items-center" href="#" data-lang="pl">
                    Polski
                    </a>
            </li>
            <li>
                <a class="dropdown-item lang-select d-flex justify-content-between text-light align-items-center" href="#" data-lang="en">
                    English
                    </a>
            </li>
        </ul>
    </div>
  </div>
</nav>
</body>
</html>
