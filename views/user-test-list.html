    function loadUserTests() {
      const container = document.getElementById('testsList');
      container.innerHTML = '';

      // Pobierz aktualny tryb sortowania (domyślnie 'none')
      const sortMode = document.getElementById('sortSelect')?.value || 'none';
      const currentLang = getCurrentLanguage();


      const tests = testsMock;
      // Tutaj w przyszłości będzie pobieranie z API/backendu

      if (!tests || tests.length === 0) {
        const t9n = translations[currentLang]?.userTestList || {};
        container.innerHTML = `<div class="text-center py-4">${t9n.noTests || 'Brak testów'}</div>`;
        return;
      }

    window.onLanguageChange = function (lang) {
      console.log('Język zmieniony na:', lang);

      updateSortSelect(lang);
      // Jeśli wyniki są wyświetlane, przetłumacz je
      const resultArea = document.getElementById('resultArea');
      if (resultArea && !resultArea.classList.contains('d-none')) {
        translateResults();
        refreshLanguageBadges();
      }

      // Aktualizuj język testu
      refreshLanguageBadges();
    };

    // Zachowaj też istniejącą funkcję updateDynamicContent dla kompatybilności
    window.updateDynamicContent = function (lang) {
      window.onLanguageChange(lang);
    };

    // Funkcja pomocnicza do pobrania aktualnego języka
    function getCurrentLanguage() {
      return localStorage.getItem('language') || 'pl';
    }

    function refreshLanguageBadges() {
      const currentLang = getCurrentLanguage();

      document.querySelectorAll('.testLanguageName').forEach(span => {
        const lang = span.textContent.trim().toLowerCase();

        // JEŚLI test był w PL → zostaje PL
        // JEŚLI test był w EN → zostaje EN
        // tłumaczymy tylko "Język / Language"
        if (lang === 'polski' || lang === 'pl') {
          span.textContent = 'Polski';
        } else {
          span.textContent = 'English';
        }
      });
    }

      // Zastosuj sortowanie
      const sortedTests = applySorting(tests, sortMode, currentLang);

      // Pobierz tłumaczenia
      const t9n = translations[currentLang]?.userTestList || {};


      sortedTests.forEach(t => {
        const a = document.createElement('a');
        const avgRating = calculateAverageFromObject(t.ratings);
        const avgDifficulty = calculateAverageFromObject(t.difficultyRatings);

        a.href = `/user-test-details?testId=${t._id}&lang=${getCurrentLanguage()}`;
        a.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';



        // Określ język testu - używamy prostego warunku
        const testLanguage = t.language === 'pl' ? 'Polski' : 'English';
        const testLanguageBadge = t.language === 'pl' ? 'Język: Polski' : 'Language: English';

        a.innerHTML = `
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h6 class="mb-0">${t.title} – ${t.user}</h6>
                  <span class="badge bg-secondary">
                      <span data-translate="language">${t9n.language}</span>:
                      <span class="testLanguageName">${testLanguage}</span>
                  </span>
                </div>
                
                ${avgRating > 0 ? `
          <div class="mt-2">

            <!-- 🔥 Trudność (3 gwiazdki) -->
            <div class="mt-1">
              <small class="me-1 fw-bold" data-translate="difficulty">${t9n.difficulty}</small>
              <small class="difficultyStars">
                ${'&#9733;'.repeat(Math.round(avgDifficulty || 0))}
                ${'&#9734;'.repeat(3 - Math.round(avgDifficulty || 0))}
              </small>
              <small class="difficulty-value ms-1">
                (${(avgDifficulty || 0)})
              </small>
            </div>
            <!-- ⭐ Ocena jakości -->
            <div class="mt-1">
              <small class="averageStars">
                ${'&#9733;'.repeat(Math.round(avgRating || 0))}
                ${'&#9734;'.repeat(5 - Math.round(avgRating || 0))}
              </small>
              <small class="rating-value ms-1">(${avgRating})</small>
              <small class="rating-count ms-2"> 
                <span data-translate="ratings">${t9n.ratings} </span> 
                <span class="ratingCount">${Object.keys(t.ratings || {}).length}</span> 
              </small>
            </div>
          </div>
        ` : `<div class="mt-2"><small class="no-ratings">${t9n.noRatings}</small></div>`}

              </div>
              <div class="text-end ms-3">
                <span class="badge bg-primary rounded-pill">
                  <span class="q-count">${t.questions.length}</span>
                  <span data-translate="questions"> ${t9n.questions}</span>
                </span>
                <small class="comments-count d-block mt-1">
                  <span class="c-lenght">${t.comments.length}</span> 
                  <span data-translate="comments">${t9n.comments}</span>
                </small>
              </div>
            `;

        // Debugowanie - sprawdź czy kliknięcie działa
        a.addEventListener('click', (e) => {
          localStorage.setItem('currentTestData', JSON.stringify(t));
          console.log('Zapisano dane testu:', t._id);
        });

        container.appendChild(a);
      });
    }

    function setupSorting() {
      const sortSelect = document.getElementById('sortSelect');
      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          loadUserTests();
          refreshLanguageBadges();
        });
      }
    }




    // Dark/Light Toggle
    document.addEventListener('DOMContentLoaded', () => {

      const currentLang = getCurrentLanguage();
      setupSorting();
      loadUserTests();
      updateDynamicContent(currentLang);
      refreshLanguageBadges();
    });
  </script>
