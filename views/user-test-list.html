    window.onLanguageChange = function(lang) {
  console.log('Język zmieniony na:', lang);
  
  // Jeśli wyniki są wyświetlane, przetłumacz je
  const resultArea = document.getElementById('resultArea');
  if (resultArea && !resultArea.classList.contains('d-none')) {
    translateResults();
  }
  
  // Aktualizuj język testu
  displayTestLanguage();
};

// Zachowaj też istniejącą funkcję updateDynamicContent dla kompatybilności
window.updateDynamicContent = function(lang) {
  window.onLanguageChange(lang);
};

    // Funkcja pomocnicza do pobrania aktualnego języka
    function getCurrentLanguage() {
      return localStorage.getItem('language') || 'pl';
    }

    function loadUserTests() {
      const container = document.getElementById('testsList');
      container.innerHTML = '';

      if (testsMock.length === 0) {
        container.innerHTML = `<div class="text-center py-4">${t('userTestList.noTests')}</div>`;
        return;
      }

      testsMock.forEach(t => {
        const a = document.createElement('a');
        a.href = `/user-test-details?testId=${t._id}&lang=${getCurrentLanguage()}`;
        a.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';

        // Pobierz aktualny język i tłumaczenia
        const currentLang = getCurrentLanguage();
        const t9n = translations[currentLang].userTestList;

        // Określ język testu - używamy prostego warunku
        const testLanguage = t.language === 'pl' ? 'Polski' : 'English';
        const testLanguageBadge = t.language === 'pl' ? 'Język: Polski' : 'Language: English';

        a.innerHTML = `
      <div class="flex-grow-1">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 class="mb-0">${t.title} – ${t.user}</h6>
          <span class="badge bg-secondary">${testLanguageBadge}</span>
        </div>
        
        ${t.averageRating ? `
          <div class="mt-2">
            <small class="star-text-warning">${'★'.repeat(Math.round(t.averageRating))}${'☆'.repeat(5 - Math.round(t.averageRating))}</small>
            <small class="rating-value ms-1">(${t.averageRating})</small>
            <small class="rating-count ms-2">${Object.keys(t.ratings || {}).length} ${t9n.ratings}</small>
          </div>
        ` : `<div class="mt-2"><small class="no-ratings">${t9n.noRatings}</small></div>`}
      </div>
      <div class="text-end ms-3">
        <span class="badge bg-primary rounded-pill">${t.questions.length} ${t9n.questions}</span>
        <small class="comments-count d-block mt-1">${t.comments.length} ${t9n.comments}</small>
      </div>
    `;

        // Debugowanie - sprawdź czy kliknięcie działa
        a.addEventListener('click', (e) => {
          localStorage.setItem('currentTestData', JSON.stringify(t));
          console.log('Zapisano dane testu:', t._id);
        });

        container.appendChild(a);
      });
    }

    function calculateAverage(ratings) {
      if (!ratings || ratings.length === 0) return 0;
      const sum = ratings.reduce((a, b) => a + b, 0);
      return (sum / ratings.length).toFixed(1);
    }

    // Pokazanie użytkownika jeśli zalogowany
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (user) {
      document.getElementById('userEmail').textContent = user.name;
      const btn = document.getElementById('authBtn');
      btn.textContent = 'Wyloguj';
      btn.href = '#';
      btn.addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.reload();
      });
      document.getElementById('regBtn').style.display = 'none';
    }
