openapi: 3.0.3
info:
  title: Admin Panel API
  version: 1.0.0
  description: API for managing users, questions, and subjects with JWT authentication.

servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  ############################################################
  # ADMIN USER MANAGEMENT
  ############################################################

  /adminPanel/users:
    get:
      summary: Search users by partial name or email
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Search term (partial match). Leave empty to return all users.
      responses:
        '200': { description: List of matching users }
        '500': { description: Server error }

  /adminPanel/users/{id}:
    get:
      summary: Get user by ID
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: User data }
        '404': { description: User not found }
        '500': { description: Server error }

    put:
      summary: Edit user (name, email, accessLvl)
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                accessLvl: { type: integer }
      responses:
        '200': { description: User updated }
        '404': { description: User not found }
        '500': { description: Server error }

  /adminPanel/users/{id}/ban:
    post:
      summary: Ban a user and send email notification
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Violation of rules
      responses:
        '200': { description: User banned & email sent }
        '404': { description: User not found }
        '500': { description: Server error }

  /adminPanel/users/{id}/delete:
    post:
      summary: Delete user (requires admin accessLvl > 2) and send email with note
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Violation of terms
      responses:
        '200': { description: User deleted & email sent }
        '403': { description: Insufficient permissions }
        '404': { description: User not found }
        '500': { description: Server error }

  ############################################################
  # QUESTIONS
  ############################################################

  /adminPanel/questions/search:
    get:
      summary: Search questions (optional query)
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search term. Leave empty to return all questions.
      responses:
        '200': { description: List of matching questions }
        '500': { description: Server error }

  /adminPanel/questions/{id}:
    get:
      summary: Get question by ID
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Question data }
        '404': { description: Question not found }
        '500': { description: Server error }

    put:
      summary: Edit question
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Question updated }
        '404': { description: Question not found }
        '500': { description: Server error }

    delete:
      summary: Delete question
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Question deleted }
        '404': { description: Question not found }
        '500': { description: Server error }

  /adminPanel/questions:
    post:
      summary: Create a new question
      tags: [Questions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Question created }
        '500': { description: Server error }

  ############################################################
  # SUBJECTS
  ############################################################

  /adminPanel/subjects/search:
    get:
      summary: Search subjects (optional query)
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search term. Leave empty to return all subjects.
      responses:
        '200': { description: List of matching subjects }
        '500': { description: Server error }

  /adminPanel/subjects/{id}:
    get:
      summary: Get subject by ID
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Subject data }
        '404': { description: Subject not found }
        '500': { description: Server error }

    put:
      summary: Edit subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Subject updated }
        '404': { description: Subject not found }
        '500': { description: Server error }

    delete:
      summary: Delete subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Subject deleted }
        '404': { description: Subject not found }
        '500': { description: Server error }

  /adminPanel/subjects:
    post:
      summary: Create a new subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Subject created }
        '500': { description: Server error }
