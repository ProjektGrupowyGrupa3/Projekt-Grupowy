openapi: 3.0.3
info:
  title: Admin Panel API
  version: 1.0.0
  description: API for managing users, questions, and subjects with JWT authentication.

servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    LocalizedString:
      type: object
      required:
        - pl
        - en
      properties:
        pl:
          type: string
          example: Programowanie Obiektowe
        en:
          type: string
          example: Object-Oriented Programming

    Subject:
      type: object
      required:
        - name
        - semester
      properties:
        name:
          $ref: '#/components/schemas/LocalizedString'
        semester:
          type: integer
          minimum: 1
          example: 2
        specialization:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'

    Answer:
      type: object
      required:
        - label
        - text
        - isCorrect
        - explanation
      properties:
        label:
          type: string
          example: A
        text:
          $ref: '#/components/schemas/LocalizedString'
        isCorrect:
          type: boolean
          example: true
        explanation:
          $ref: '#/components/schemas/LocalizedString'

    Question:
      type: object
      required:
        - subject
        - question
        - answers
        - number
      properties:
        subject:
          type: string
          description: MongoDB ObjectId of Subject
          example: 64f8d3b21a9c4e0e8c9a1234
        question:
          $ref: '#/components/schemas/LocalizedString'
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Answer'
        difficulty:
          type: string
          enum: [easy, medium, hard]
          default: medium
          example: medium
        tags:
          type: array
          items:
            type: string
          example: [Loops, Basics]
        number:
          type: integer
          example: 101
          
paths:
  ############################################################
  # USER REGISTER
  ############################################################
  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Alice Doe
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123
                  description: Must be at least 8 characters long, contain at least one letter and one number
                  pattern: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    type: object
                    properties:
                      id: { type: string, example: 671ba88e2c7a6d76c4a6f123 }
                      name: { type: string, example: Alice Doe }
                      email: { type: string, example: alice@example.com }
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400': { description: Invalid input or user already exists }
        '500': { description: Server error }
  ############################################################
  # USER LOGIN
  ############################################################
  /auth/login:
    post:
      summary: Log in an existing user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Login successful }
                  user:
                    type: object
                    properties:
                      id: { type: string, example: 671ba88e2c7a6d76c4a6f123 }
                      name: { type: string, example: Alice Doe }
                      email: { type: string, example: alice@example.com }
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400': { description: Invalid credentials }
        '500': { description: Server error }
  ############################################################
  # USER RESET PASSWORD
  ############################################################

  /auth/reset-password:
    post:
      summary: Request a password reset link
      tags: [Authentication]
      description: Creates a reset token in database, TTL 1h, and sends an email containing the reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reset link has been sent to your email address
        '404':
          description: No user found with that email
        '500':
          description: Server error
  ############################################################
  # USER PASSWORD RESERT CONFIRM
  ############################################################
  /auth/reset-password-confirm:
    post:
      summary: Confirm password reset and set new password
      tags: [Authentication]
      description: Validates reset token, updates user's password and removes used token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  example: 678abc1299eece42f19fa321
                newPassword:
                  type: string
                  format: password
                  example: NewSecurePass1
                  description: Must be at least 8 characters long, contain at least one letter and one number
                  pattern: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$"
      responses:
        '200':
          description: Password successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password has been reset successfully
        '400':
          description: Invalid or expired token / weak password
        '500':
          description: Server error
  ############################################################
  # ADMIN USER MANAGEMENT
  ############################################################

  /adminPanel/users:
    get:
      summary: Search users by partial name or email
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
          description: Search term (partial match). Leave empty to return all users.
      responses:
        '200': { description: List of matching users }
        '500': { description: Server error }

  /adminPanel/users/{id}:
    get:
      summary: Get user by ID
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: User data }
        '404': { description: User not found }
        '500': { description: Server error }

    put:
      summary: Edit user (name, email, accessLvl)
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                accessLvl: { type: integer }
      responses:
        '200': { description: User updated }
        '404': { description: User not found }
        '500': { description: Server error }

  /adminPanel/users/{id}/ban:
    post:
      summary: Ban a user and send email notification
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Violation of rules
      responses:
        '200': { description: User banned & email sent }
        '404': { description: User not found }
        '500': { description: Server error }

  /adminPanel/users/{id}/delete:
    post:
      summary: Delete user (requires admin accessLvl > 2) and send email with note
      tags: [Admin - Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Violation of terms
      responses:
        '200': { description: User deleted & email sent }
        '403': { description: Insufficient permissions }
        '404': { description: User not found }
        '500': { description: Server error }

  ############################################################
  # QUESTIONS
  ############################################################

  /adminPanel/questions/search:
    get:
      summary: Search questions (optional query)
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search term. Leave empty to return all questions.
      responses:
        '200': { description: List of matching questions }
        '500': { description: Server error }

  /adminPanel/questions/{id}:
    get:
      summary: Get question by ID
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Question data }
        '404': { description: Question not found }
        '500': { description: Server error }

    put:
      summary: Edit question
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
            example:
              subject: 64f8d3b21a9c4e0e8c9a1234
              question:
                pl: Co to jest pętla for?
                en: What is a for loop?
              answers:
                - label: A
                  text:
                    pl: Służy do iteracji
                    en: Used for iteration
                  isCorrect: true
                  explanation:
                    pl: Pętla for wykonuje kod wielokrotnie
                    en: A for loop repeats code execution
                - label: B
                  text:
                    pl: Deklaruje zmienną
                    en: Declares a variable
                  isCorrect: false
                  explanation:
                    pl: To nie jest jej główne zastosowanie
                    en: This is not its primary purpose
              difficulty: easy
              tags: [Loops, Basics]
              number: 101
      responses:
        '200': { description: Question updated }
        '404': { description: Question not found }
        '500': { description: Server error }

    delete:
      summary: Delete question
      tags: [Questions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Question deleted }
        '404': { description: Question not found }
        '500': { description: Server error }

  /adminPanel/questions:
    post:
      summary: Create a new question
      tags: [Questions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
            example:
              subject: 64f8d3b21a9c4e0e8c9a1234
              question:
                pl: Co to jest pętla for?
                en: What is a for loop?
              answers:
                - label: A
                  text:
                    pl: Służy do iteracji
                    en: Used for iteration
                  isCorrect: true
                  explanation:
                    pl: Pętla for wykonuje kod wielokrotnie
                    en: A for loop repeats code execution
                - label: B
                  text:
                    pl: Deklaruje zmienną
                    en: Declares a variable
                  isCorrect: false
                  explanation:
                    pl: To nie jest jej główne zastosowanie
                    en: This is not its primary purpose
              difficulty: easy
              tags: [Loops, Basics]
      responses:
        '201':
          description: Question created
        '500':
          description: Server error


  ############################################################
  # SUBJECTS
  ############################################################

  /adminPanel/subjects/search:
    get:
      summary: Search subjects (optional query)
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search term. Leave empty to return all subjects.
      responses:
        '200': { description: List of matching subjects }
        '500': { description: Server error }

  /adminPanel/subjects/{id}:
    get:
      summary: Get subject by ID
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Subject data }
        '404': { description: Subject not found }
        '500': { description: Server error }

    put:
      summary: Edit subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subject'
            example:
              name:
                pl: Programowanie Obiektowe
                en: Object-Oriented Programming
              semester: 2
              specialization:
                pl: Informatyka
                en: Computer Science
              description:
                pl: Przedmiot wprowadzający do programowania obiektowego w języku Java.
                en: An introductory course to object-oriented programming using Java.
      responses:
        '200': { description: Subject updated }
        '404': { description: Subject not found }
        '500': { description: Server error }

    delete:
      summary: Delete subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Subject deleted }
        '404': { description: Subject not found }
        '500': { description: Server error }

  /adminPanel/subjects:
    post:
      summary: Create a new subject
      tags: [Subjects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subject'
            example:
              name:
                pl: Programowanie Obiektowe
                en: Object-Oriented Programming
              semester: 2
              specialization:
                pl: Informatyka
                en: Computer Science
              description:
                pl: Przedmiot wprowadzający do programowania obiektowego w języku Java.
                en: An introductory course to object-oriented programming using Java.
      responses:
        '201':
          description: Subject created
        '500':
          description: Server error
